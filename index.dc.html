<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0!important;padding:0!important;}
  #dc-root{margin:0!important;padding:0!important;width:100%!important;
           max-width:none!important;border:0!important;border-radius:0!important;background:#F7F9FB!important;}
  #dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
</style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#F7F9FB;}
  a{color:#15181C;text-decoration:none;} a:hover{color:#1E5AA8;}
  .vp-in{max-width:1560px;margin:0 auto;padding:0 32px;}
  @media (max-width:819px){ .vp-in{padding:0 16px;} }
  .hp-sec{padding:40px 0;}
  @media (max-width:819px){ .hp-sec{padding:24px 0;} }
  .hp-h2{font-size:28px;line-height:1.2;letter-spacing:-0.01em;}
  @media (max-width:819px){ .hp-h2{font-size:22px;line-height:1.25;} }
  .hp-h1{font-size:36px;line-height:1.15;letter-spacing:-0.02em;}
  @media (max-width:819px){ .hp-h1{font-size:26px;line-height:1.2;} }
  @media (max-width:819px){ .hp-h1row{flex-direction:column;gap:16px;} }
  .hp-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
</style>
</helmet>
<div data-screen-label="Homepage" style="font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;background:#F7F9FB;width:100%;margin:0;padding:0;min-height:100vh;">

  <dc-import name="Usp" variant="pas" tone="tmavy" items="{{ uspPas }}" debug="{{ debug }}" hint-size="100%,48px"></dc-import>

  <dc-import name="Hlavicka" active="" contact-open="{{ contactOpen }}" debug="{{ debug }}" hint-size="100%,150px"></dc-import>

  <main>
    <dc-import name="HeroHomepage" variant="{{ heroVer }}" debug="{{ debug }}" hint-size="100%,420px"></dc-import>

    <section aria-labelledby="hp-h1" class="hp-sec" style="padding-top:64px;padding-bottom:56px;">
      <div class="vp-in" style="display:flex;flex-direction:column;gap:20px;">
        <div class="hp-h1row" style="display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;">
          <h1 id="hp-h1" class="hp-h1" style="margin:0;font-weight:700;color:#15181C;text-wrap:pretty;text-align:center;">Přívěsy a náhradní díly</h1>
          <a href="onas.dc.html" style="display:inline-flex;align-items:center;gap:12px;background:#FFFFFF;border-radius:999px;padding:10px 20px;text-decoration:none;box-shadow:0 6px 20px rgba(20,47,86,.10);">
            <span style="display:inline-flex;color:#F5A623;">
              <dc-import name="Ikony" icon-name="star-filled" size="{{ 24 }}" hint-size="24px,24px"></dc-import>
            </span>
            <span style="font-size:16px;font-weight:700;color:#15181C;">4,8 z 5</span>
            <span style="font-size:15px;font-weight:400;color:#5A626C;">Ověřeno zákazníky · Heureka</span>
          </a>
        </div>
        <dc-import name="Usp" variant="sloupce" items="{{ uspGrid }}" docs="{{ false }}" debug="{{ debug }}" hint-size="100%,150px"></dc-import>
      </div>
    </section>

    <section aria-label="Karusely produktů" class="hp-sec" style="background:#EFF4FB;margin-bottom:40px;">
      <div class="vp-in" style="display:flex;flex-direction:column;gap:40px;">
        <dc-import name="ProduktovyKarusel" title="Přívěsy" items="{{ privesyItems }}" all-label="Zobrazit vše" all-href="privesy-V1.dc.html" detail-href="detail-prives-V1.dc.html" debug="{{ debug }}" hint-size="100%,620px"></dc-import>
        <dc-import name="ProduktovyKarusel" title="Náhradní díly" items="{{ dilyItems }}" all-label="Zobrazit vše" all-href="nahradnidily.dc.html" detail-href="detail-nahradnidil-V1.dc.html" debug="{{ debug }}" hint-size="100%,620px"></dc-import>
      </div>
    </section>

    <section aria-label="Servis a půjčovna" style="background:linear-gradient(rgba(20,47,86,.40),rgba(20,47,86,.58)),#142F56 url('./sekce-servis.png') center/cover no-repeat;padding:56px 0;">
      <div class="vp-in">
        <dc-import name="SluzbyBloky" tone="dark" debug="{{ debug }}" hint-size="100%,360px"></dc-import>
      </div>
    </section>

    <section aria-labelledby="hp-cats" class="hp-sec" style="display:none;">
      <div class="vp-in">
        <div class="hp-head">
          <h2 id="hp-cats" class="hp-h2" style="margin:0;font-weight:700;color:#15181C;">Co u nás hledáte?</h2>
          <span style="font-size:16px;font-weight:400;color:#666E78;">Rozcestník hlavních sekcí e-shopu</span>
        </div>
        <dc-import name="RozcestnikSekci" items="{{ categories }}" debug="{{ debug }}" hint-size="100%,760px"></dc-import>
      </div>
    </section>

    <section aria-label="Poradna" class="hp-sec" style="padding-bottom:64px;">
      <div class="vp-in">
        <dc-import name="PoradnaBlok" debug="{{ debug }}" hint-size="100%,560px"></dc-import>
      </div>
    </section>

    <section aria-label="Poradenství" style="padding-bottom:40px;">
      <div class="vp-in">
        <dc-import name="PoradenskyBlok" open="{{ contactOpen }}" variant="standard" debug="{{ debug }}" hint-size="100%,80px"></dc-import>
      </div>
    </section>

    <section aria-label="O firmě a recenze zákazníků" style="background:#EFF4FB;padding:56px 0;">
      <div class="vp-in" style="display:flex;flex-direction:column;gap:48px;">
        <dc-import name="PribehFirmy" debug="{{ debug }}" hint-size="100%,330px"></dc-import>
        <dc-import name="Recenze" debug="{{ debug }}" hint-size="100%,320px"></dc-import>
      </div>
    </section>
  </main>

  <dc-import name="Paticka" open="{{ contactOpen }}" bare="true" debug="{{ debug }}" hint-size="100%,520px"></dc-import>
</div>
<dc-import name="PrezentacniLista" label="Hero:" variants="{{ heroVariants }}" active="{{ heroVer }}" on-select="{{ onHeroVer }}" label2="Ot. doba:" variants2="{{ openVariants }}" active2="{{ openState }}" on-select2="{{ onOpenState }}" debug-on="{{ debugOn }}" on-toggle-debug="{{ onToggleDebug }}" hint-size="320px,56px"></dc-import>
<dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;debug&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;}}">
class Component extends DCLogic {
  CATS = [
    { key:'privesy', name:'Přívěsy', href:'privesy-V1.dc.html', image:'./sekce-privesy.png', count:186, countText:'186 modelů přívěsů',
      subs:['Valníkové přívěsy','Sklopné přívěsy','Skříňové přívěsy','Přepravníky aut','Přepravníky lodí'] },
    { key:'nahradni-dily', name:'Náhradní díly', href:'nahradnidily.dc.html', image:'./sekce-nahradni-dily.png', count:4218, countText:'4 218 produktů skladem',
      subs:['Díly náprav','Nájezdové brzdy a díly','Elektro, svítilny, odrazky','Pneu, kola, disky','Spojovací zařízení a zámky'] },
    { key:'servis', name:'Servis', href:'servis.dc.html', image:'./sekce-servis.png', count:9, countText:'9 servisních úkonů',
      subs:['Servis přívěsů','Servis náprav AL-KO','Servis KNOTT','Příprava na STK','Rezervace termínu'] },
    { key:'pujcovna', name:'Půjčovna', image:'./sekce-pujcovna.png', count:14, countText:'14 přívěsů k zapůjčení',
      subs:['Půjčovna přívěsů','Denní pronájem','Víkendový pronájem','Ceník půjčovny'] },
    { key:'poradna', name:'Poradna', href:'poradna.dc.html', image:'./sekce-poradna.png', count:32, countText:'32 článků a návodů',
      subs:['Jak vybrat přívěs','Zapojení zásuvky 7 a 13 pin','Seřízení nájezdové brzdy','Výměna ložisek náprav'] },
    { key:'akce', name:'Akce a slevy', image:'./sekce-akce.png', count:148, countText:'148 zlevněných položek', badge:'Sleva',
      subs:['Zlevněné přívěsy','Doprodej dílů','Bazar přívěsů'] }
  ];
  // finální USP od klienta; ikony jsou zástupné, klient je ještě vybírá
  USP = [
    { icon:'award', title:'35 let zkušeností', text:'35 let výroby přívěsů a zkušeností' },
    { icon:'building-warehouse', title:'Sklad dílů', text:'Největší skladové zásoby náhradních dílů v ČR' },
    { icon:'rocket', title:'Rychlá expedice', text:'Skladové položky expedujeme do druhého dne' },
    { icon:'tool', title:'Autorizovaný servis', text:'Autorizovaný servis AL-KO a KNOTT' }
  ];
  PRIVESY = [
    { name:'VAPP Praktik 2', objNum:'PRA2', img:'uploads/prives-vapp-praktik-2.jpg', net:'42 149 Kč', gross:'51 000 Kč', stock:4, reviews:18, rating:5,
      specs:[{label:'Ložná plocha',value:'2030 × 1230 mm'},{label:'Celková hmotnost',value:'750 kg'},{label:'Nosnost',value:'570 kg'}] },
    { name:'VAPP PAP 2.0 4019', objNum:'PAP2040', img:'uploads/prives-vapp-pap-2-0-4019.jpg', net:'68 595 Kč', gross:'83 000 Kč', stock:2, reviews:11, rating:4,
      specs:[{label:'Ložná plocha',value:'4000 × 1900 mm'},{label:'Celková hmotnost',value:'2 000 kg'},{label:'Nosnost',value:'1 540 kg'}] },
    { name:'VAPP PVS 2.7 4021 sklopný', objNum:'PVS2740', img:'uploads/prives-vapp-pvs-2-7-4021.jpg', net:'96 694 Kč', gross:'117 000 Kč', stock:1, sale:8, reviews:7, rating:5,
      specs:[{label:'Ložná plocha',value:'4000 × 2100 mm'},{label:'Celková hmotnost',value:'2 700 kg'},{label:'Nosnost',value:'2 090 kg'}] },
    { name:'VAPP P3S 2.7 3618 třístranný sklápěč', objNum:'P3S2736', img:'uploads/prives-vapp-p3s-2-7-3618.jpg', net:'149 587 Kč', gross:'181 000 Kč', stock:0, reviews:5, rating:5,
      specs:[{label:'Ložná plocha',value:'3600 × 1800 mm'},{label:'Celková hmotnost',value:'2 700 kg'},{label:'Nosnost',value:'1 950 kg'}] },
    { name:'VAPP Moto Profi 132', objNum:'MOT132', img:'uploads/prives-vapp-moto-profi-132.jpg', net:'38 843 Kč', gross:'47 000 Kč', stock:6, reviews:24, rating:4,
      specs:[{label:'Ložná plocha',value:'2200 × 1320 mm'},{label:'Celková hmotnost',value:'750 kg'},{label:'Nosnost',value:'540 kg'}] },
    { name:'VAPP PAV 2.7 4220 dvouosý valník', objNum:'PAV2742', img:'uploads/prives-vapp-pap-2-0-4019.jpg', net:'88 430 Kč', gross:'107 000 Kč', stock:3, reviews:9, rating:4,
      specs:[{label:'Ložná plocha',value:'4210 × 2020 mm'},{label:'Celková hmotnost',value:'2 700 kg'},{label:'Nosnost',value:'2 100 kg'}] },
    { name:'VAPP Praktik 1 jednoosý valník', objNum:'PRA1', img:'uploads/prives-vapp-praktik-2-1.jpg', net:'34 711 Kč', gross:'42 000 Kč', stock:7, reviews:12, rating:4,
      specs:[{label:'Ložná plocha',value:'2030 × 1230 mm'},{label:'Celková hmotnost',value:'750 kg'},{label:'Nosnost',value:'580 kg'}] },
    { name:'VAPP Moto Sport 1 přepravník', objNum:'MOTS1', img:'uploads/prives-vapp-moto-profi-132-1.jpg', net:'29 752 Kč', gross:'36 000 Kč', stock:5, sale:10, reviews:16, rating:5,
      specs:[{label:'Ložná plocha',value:'2110 × 1550 mm'},{label:'Celková hmotnost',value:'750 kg'},{label:'Kapacita',value:'1 motocykl'}] },
    { name:'VAPP PVS 2.0 3618 sklopný', objNum:'PVS2036', img:'uploads/prives-vapp-pvs-2-7-4021-1.jpg', net:'79 339 Kč', gross:'96 000 Kč', stock:2, reviews:4, rating:5,
      specs:[{label:'Ložná plocha',value:'3600 × 1800 mm'},{label:'Celková hmotnost',value:'2 000 kg'},{label:'Nosnost',value:'1 490 kg'}] },
    { name:'VAPP P3S 2.0 3018 třístranný sklápěč', objNum:'P3S2030', img:'uploads/prives-vapp-p3s-2-7-3618-1.jpg', net:'119 008 Kč', gross:'144 000 Kč', stock:1, reviews:6, rating:5,
      specs:[{label:'Ložná plocha',value:'3000 × 1800 mm'},{label:'Celková hmotnost',value:'2 000 kg'},{label:'Nosnost',value:'1 420 kg'}] }
  ];
  DILY = [
    { name:'Opěrné kolečko DTR ⌀48 mm, nosnost 150 kg', objNum:'404815', img:'uploads/kolecko-operne-dtr-prum-48-150-kg.jpg', net:'397 Kč', gross:'480 Kč', stock:22, sale:15, reviews:23, rating:4 },
    { name:'Manžeta gumová KNOTT KF/KR 7,5 až 27', objNum:'907527', img:'uploads/manzeta-gumova-knott-kf-kr-7-5-az-27.jpg', net:'157 Kč', gross:'190 Kč', stock:44, reviews:9, rating:5 },
    { name:'Čelisti brzdové KNOTT 200×50, sada na 2 kola', objNum:'902005', img:'uploads/celisti-brzdove-knott-200x50-mala-sada-na-2-kola.jpg', net:'1 190 Kč', gross:'1 440 Kč', stock:17, reviews:31, rating:5 },
    { name:'Pneu 165 R13 C 96N, 710 kg, Kenda M+S', objNum:'165130', img:'uploads/pneu-165-r13-c-96n-710-kg-kenda-m-s.jpg', net:'1 149 Kč', gross:'1 390 Kč', stock:12, reviews:14, rating:4 },
    { name:'Zástrčka 7pólová 12 V kovová Jaeger', objNum:'701207', img:'uploads/zastrcka-vidlice-7-pol-12v-kovova-jaeger.jpg', net:'289 Kč', gross:'350 Kč', stock:38, reviews:6, rating:4 },
    { name:'Zámek Albe Safety Box XL k rozvírací spojce', objNum:'ALBEXL', img:'uploads/zamek-albe-safety-box-xl-k-rozviraci.jpg', net:'2 314 Kč', gross:'2 800 Kč', stock:0, reviews:3, rating:5 },
    { name:'Náboj nebrzděný KNOTT 112×5 vč. ložisek', objNum:'301125', img:'uploads/naboj-nebrzdeny-knott-112x5-l-lv-vc-loziska.jpg', net:'1 397 Kč', gross:'1 690 Kč', stock:8, reviews:11, rating:5 },
    { name:'Nájezdová brzda KNOTT KF13', objNum:'901301', img:'uploads/najezdova-brzda-knott-kf13-e-gf.jpg', net:'4 876 Kč', gross:'5 900 Kč', stock:12, reviews:7, rating:5 },
    { name:'Kulová spojka Winterhoff WW 8', objNum:'400860', img:'uploads/kulova-spojka-ww8-1.jpg', net:'645 Kč', gross:'780 Kč', stock:21, reviews:5, rating:4 },
    { name:'Naviják ruční KNOTT 900 kg bez lana', objNum:'702007', img:'uploads/navijak-knott-702007-900kg-bez-lana.jpg', net:'1 810 Kč', gross:'2 190 Kč', stock:6, reviews:8, rating:4 },
    { name:'Blatník půlený plastový 200 mm, 2 ks', objNum:'102240', img:'uploads/blatnik-puleny-plastovy-s-200-mm-2-ks-domar.jpg', net:'405 Kč', gross:'490 Kč', stock:34, reviews:12, rating:4 }
  ];
  slug(s){
    return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }
  // podkategorie rozcestníku míří na hotové stránky prototypu, jinak na hash cestu
  subHref(c, s){
    if (c.key === 'privesy') return 'privesy-V1.dc.html';
    if (c.key === 'nahradni-dily') return 'nahradnidily.dc.html#/nahradni-dily/' + this.slug(s) + '/';
    if (c.key === 'servis') return 'servis.dc.html';
    if (c.key === 'poradna') return 'poradna.dc.html';
    return '#/' + c.key + '/' + this.slug(s) + '/';
  }
  state = Object.assign({}, this.state, { heroVer: (typeof localStorage !== 'undefined' && localStorage.getItem('vapp-hero-variant')) || 'V1', debugOverride: null });
  setHeroVer(id){
    const v = id === 'v2' || id === 'V2' ? 'V2' : 'V1';
    try{ localStorage.setItem('vapp-hero-variant', v); }catch(e){}
    this.setState({ heroVer: v });
  }
  renderVals(){
    const P = this.props;
    const heroVer = this.state.heroVer === 'V2' ? 'V2' : 'V1';
    const contactOpen = this.state.contactOpen !== false;
    const debugOn = this.state.debugOverride === null ? (P.debug ?? true) : this.state.debugOverride;
    // rozcestník nese jen produktové sekce; servis, půjčovna, poradna a akce jsou skryté (data zůstávají)
    const HIDDEN = ['servis','pujcovna','poradna','akce'];
    const categories = this.CATS.filter(c=>!HIDDEN.includes(c.key)).map(c=>({
      name: c.name, count: c.count, countText: c.countText, image: c.image, badge: c.badge,
      href: c.href || ('#/' + c.key + '/'),
      subs: c.subs.map(s=>({ name:s, href: this.subHref(c, s) }))
    }));
    return {
      categories,
      privesyItems: this.PRIVESY,
      dilyItems: this.DILY,
      uspGrid: this.USP,
      // pás nese USP i sezónní sdělení
      uspPas: this.USP.concat([
        { icon:'truck-delivery', title:'Doprava', text:'Doprava zdarma při nákupu nad 5 000 Kč' },
        { icon:'map-pin', title:'Pobočky', text:'Osobní odběr v Popovičkách' }
      ]),
      contactOpen,
      openState: contactOpen ? 'on' : 'off',
      openVariants: [{ id:'on', label:'On' }, { id:'off', label:'Off' }],
      onOpenState: (id)=>this.setState({ contactOpen: id === 'on' }),
      heroVer,
      heroVariants: [{ id:'V1', label:'V1' }, { id:'V2', label:'V2' }],
      onHeroVer: (id)=>this.setHeroVer(id),
      debugOn,
      onToggleDebug: ()=>this.setState({ debugOverride: !debugOn }),
      debug: debugOn
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0!important;padding:0!important;}
  #dc-root{margin:0!important;padding:0!important;width:100%!important;
           max-width:none!important;border:0!important;}
  #dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
</style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- barva #97DBB4 u textu „právě otevřeno" = token status.openOnDark (green.200) -->
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<script src="./vapp-menu.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#F7F9FB;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  .vapp-led{border-radius:999px;}
  .hd-i{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;line-height:inherit;text-decoration:none;cursor:pointer;}
  .hd-i:focus-visible{outline:2px solid #1E5AA8;outline-offset:2px;}
  .hd-ondark:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px;}
  .hd-hit{position:relative;}
  .hd-hit::after{content:"";position:absolute;left:0;right:0;top:-4px;bottom:-4px;}
  .hd-tab{transition:color .12s;} .hd-tab:hover{color:#1E5AA8 !important;}
  .hd-icon{transition:background .12s;} .hd-icon:hover{background:#F2F4F7 !important;}
  .hd-v4 .hd-icon{background:#1E5AA8 !important;color:#FFFFFF !important;}
  .hd-v4 .hd-icon:hover{background:#1A4A8A !important;}
  .hd-v4 .hd-icon:active{transform:translateY(1px);}
  .hd-act{color:#1E5AA8;transition:color .12s;} .hd-act:hover{color:#C5232B;}
  .sc-host[data-sc-name="Hlavicka"]{display:contents;}
  .hd-root{position:sticky;top:0;z-index:70;} /* z.header — stín, posun a pointer-events jdou přes CSS proměnné v inline stylu */
  /* S2 sticky režim výpisu (--vp-* proměnné nastavuje stránka): v pásu skryté navigace
     hlavička nepaintuje ani nechytá pointer, aby jím prosvítala přilepená filtrační lišta. */
  .hd-root.hd-navoff{pointer-events:none;background:transparent !important;box-shadow:none;}
  .hd-root.hd-navoff .hd-toprow,
  .hd-root.hd-navoff #hd-mega,
  .hd-root.hd-navoff #hd-mobile-menu{pointer-events:auto;}
  @media (max-width:999px){ .hd-dt{display:none !important;} }
  @media (min-width:1000px){ .hd-mb{display:none !important;} }
  .vp-in{max-width:1560px;margin-left:auto;margin-right:auto;padding-left:32px;padding-right:32px;}
  @media (max-width:819px){ .vp-in{padding-left:16px;padding-right:16px;} }
  @media (max-width:549px){ .hd-actlbl{display:none !important;} .hd-acts{gap:4px !important;} }
  /* XS a XXS: čítač košíku přečnívá vpravo — hamburger potřebuje odstup */
  @media (max-width:549px){ #hd-cart{margin-right:16px !important;} }
  @media (max-width:419px){ .hd-logo{height:24px !important;} }
  /* XXS: řádek se musí vejít i na 320 px — stlačíme mezery a odsazení ikon */
  @media (max-width:419px){
    .hd-logorow{gap:8px !important;}
    .hd-act{padding-left:2px !important;padding-right:2px !important;}
    .hd-acts{gap:2px !important;}
  }
  @media (max-width:819px){ .hd-mdup{display:none !important;} }
  @media (min-width:820px){ .hd-sdn{display:none !important;} }
  .hd-kb{margin-left:auto;}
  /* pod 1150 se e-mail nevejde vedle telefonu a ikon — místo zalomení řádku ho skryjeme */
  @media (max-width:1149px){ .hd-mailblk{display:none !important;} }
  .hd-v4 .hd-mbsearch{display:none !important;}
  .hd-v4 .hd-acts{margin-left:0 !important;}
  @media (max-width:819px){ .hd-v4 .hd-acts{margin-left:auto !important;} }
  .hd-mail{transition:color .12s;} .hd-mail:hover{color:#1E5AA8 !important;}
</style>
</helmet>
<header class="hd-root {{ rootCls }}" style="font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;width:100%;margin:0;padding:0;transform:translateY(var(--vp-hdr-push,0px));box-shadow:var(--vp-hdr-shadow,0 2px 8px rgba(20,47,86,.06));pointer-events:var(--vp-hdr-pe,auto);">
  <div style="background:transparent;">
    <div class="hd-toprow" style="background:#fff;border-bottom:1px solid #F2F4F7;pointer-events:auto;">
    <div class="vp-in hd-logorow" style="display:flex;align-items:center;gap:14px;padding-top:20px;padding-bottom:20px;flex-wrap:wrap;">
      <a class="hd-i" href="{{ logoHref }}" aria-label="VAPP — domovská stránka" onClick="{{ onLogoNav }}" style="display:flex;flex:none;cursor:pointer;"><img class="hd-logo" src="./vapp-logo.svg" alt="VAPP" style="height:30px;display:block;"></a>
      <div class="hd-dt hd-search-inline" style="flex:1;min-width:200px;max-width:520px;margin-left:auto;margin-right:auto;">
        <dc-import name="Vyhledavani" bare="true" height="44" value="{{ searchValue }}" on-change="{{ onSearchChange }}" placeholder="Hledat díly podle názvu, čísla nebo modelu…" hint-size="100%,44px"></dc-import>
      </div>
      <sc-if value="{{ showKb }}" hint-placeholder-val="">
        <div class="hd-kb hd-mdup" style="flex:none;">
          <dc-import name="KontaktBlok" phone="{{ contactPhone }}" phone-href="{{ contactPhoneHref }}" hours="{{ contactHours }}" open="{{ contactOpen }}" debug="{{ debug }}" hint-size="190px,44px"></dc-import>
        </div>
      </sc-if>
      <sc-if value="{{ showMail }}" hint-placeholder-val="">
        <div class="hd-mdup hd-mailblk" style="flex:none;display:flex;align-items:center;gap:6px;margin-right:32px;">
          <span aria-hidden="true" style="display:flex;color:#1E5AA8;flex:none;"><dc-import name="Ikony" icon-name="mail" size="24" hint-size="24px,24px"></dc-import></span>
          <a class="hd-i hd-mail hd-hit" href="{{ contactEmailHref }}" style="font-size:16px;font-weight:700;line-height:1.25;color:#15181C;white-space:nowrap;cursor:pointer;">{{ contactEmail }}</a>
        </div>
      </sc-if>
      <div class="hd-acts" style="margin-left:auto;display:flex;align-items:center;gap:10px;">
        <sc-if value="{{ showSearchAct }}" hint-placeholder-val="">
          <button type="button" class="hd-act hd-i hd-mb" id="hd-search-toggle" aria-label="Hledat" aria-expanded="{{ searchExpanded }}" aria-controls="hd-search-panel" onClick="{{ toggleSearch }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:0 8px;cursor:pointer;"><div style="display:flex;align-items:center;justify-content:center;"><dc-import name="Ikony" icon-name="search" size="24" hint-size="24px,24px"></dc-import></div><span class="hd-actlbl" style="font-size:13px;font-weight:600;">Hledat</span></button>
        </sc-if>
        <button type="button" class="hd-act hd-i" id="hd-login" aria-label="Přihlásit" onClick="{{ openLogin }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:0 8px;cursor:pointer;"><div style="display:flex;align-items:center;justify-content:center;"><dc-import name="Ikony" icon-name="user" size="24" hint-size="24px,24px"></dc-import></div><span class="hd-actlbl" style="font-size:13px;font-weight:600;">Přihlásit</span></button>
        <sc-if value="{{ showCompareAct }}" hint-placeholder-val="">
        <button type="button" class="hd-act hd-i" aria-label="{{ compareAria }}" onClick="{{ onCompare }}" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px;padding:0 8px;cursor:pointer;">
          <div style="position:relative;display:flex;align-items:center;justify-content:center;"><dc-import name="Ikony" icon-name="arrows-exchange" size="24" hint-size="24px,24px"></dc-import><sc-if value="{{ showCompare }}" hint-placeholder-val=""><span aria-hidden="true" style="position:absolute;top:-4px;right:-8px;min-width:16px;width:16px;height:16px;border-radius:999px;background:#C5232B;color:#fff;font-size:10px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;">{{ compareCount }}</span></sc-if></div>
          <span class="hd-actlbl" style="font-size:13px;font-weight:600;">Porovnat</span>
        </button>
        </sc-if>
        <span id="hd-cart" style="display:inline-flex;"><dc-import name="Kosik" count="{{ cartCount }}" total="{{ cartTotal }}" currency="{{ currency }}" currencies="{{ currencyCodes }}" on-currency-change="{{ onMenuCurrency }}" on-hover-enter="{{ onCartEnter }}" on-hover-leave="{{ onCartLeave }}" on-click="{{ onCartClick }}" hint-size="150px,44px"></dc-import></span>
        <button type="button" class="hd-mb hd-icon hd-i" id="hd-burger" aria-label="{{ menuLabel }}" aria-expanded="{{ menuExpanded }}" aria-controls="hd-mobile-menu" onClick="{{ toggleMenu }}" style="width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#1E5AA8;cursor:pointer;"><sc-if value="{{ menuOpen }}" hint-placeholder-val=""><dc-import name="Ikony" icon-name="x" size="24" hint-size="24px,24px"></dc-import></sc-if><sc-if value="{{ menuClosed }}" hint-placeholder-val="{{ true }}"><dc-import name="Ikony" icon-name="menu-2" size="24" hint-size="24px,24px"></dc-import></sc-if></button>
      </div>
      <sc-if value="{{ searchOpen }}" hint-placeholder-val="">
        <div class="hd-mb" id="hd-search-panel" style="flex-basis:100%;padding-top:4px;">
          <dc-import name="Vyhledavani" bare="true" autofocus="{{ true }}" height="44" value="{{ searchValue }}" on-change="{{ onSearchChange }}" on-field-focus="{{ onSearchFieldFocus }}" placeholder="Hledat díly podle názvu, čísla nebo modelu…" hint-size="100%,44px"></dc-import>
        </div>
      </sc-if>
      <div class="hd-mb hd-mbsearch" style="flex-basis:100%;">
        <dc-import name="Vyhledavani" bare="true" height="42" value="{{ searchValue }}" on-change="{{ onSearchChange }}" on-field-focus="{{ onSearchFieldFocus }}" placeholder="Hledat díly, přívěsy…" hint-size="100%,42px"></dc-import>
      </div>
    </div>
    </div>
    <nav class="hd-dt" aria-label="Hlavní navigace" style="background:#fff;border-bottom:1px solid #F2F4F7;pointer-events:var(--vp-nav-pe,auto);opacity:var(--vp-nav-op,1);visibility:var(--vp-nav-vis,visible);transition:opacity .3s ease, visibility 0s linear var(--vp-nav-delay,0s);">
      <div class="vp-in" style="display:flex;align-items:center;gap:26px;">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
          <a class="{{ t.cls }}" href="{{ t.href }}" aria-current="{{ t.current }}" aria-expanded="{{ t.expanded }}" onClick="{{ t.onClick }}" onMouseEnter="{{ t.onEnter }}" onMouseLeave="{{ t.onLeave }}" onFocus="{{ t.onFocus }}" style="{{ t.style }}">{{ t.label }}</a>
        </sc-for>
      </div>
    </nav>
    <sc-if value="{{ megaOpen }}" hint-placeholder-val="">
      <div class="hd-dt" id="hd-mega" onMouseEnter="{{ onMegaEnter }}" onMouseLeave="{{ onMegaLeave }}" style="position:absolute;top:100%;left:0;right:0;z-index:60;pointer-events:auto;box-shadow:0 10px 30px rgba(20,30,45,.14);">
        <dc-import name="MegaMenu" groups="{{ megaGroups }}" all-label="{{ megaAllLabel }}" all-href="{{ megaAllHref }}" cats-label="{{ megaCatsLabel }}" cats-href="{{ megaCatsHref }}" rail-items="{{ megaRail }}" heading="{{ megaTab }}" columns="{{ megaColumns }}" max-items="{{ megaMaxItems }}" debug="{{ debug }}" hint-size="100%,420px"></dc-import>
      </div>
    </sc-if>
    <sc-if value="{{ menuOpen }}" hint-placeholder-val="">
      <div class="hd-mb" id="hd-mobile-menu" role="navigation" aria-label="Hlavní menu" tabindex="-1" onKeyDown="{{ onMenuKey }}" style="position:absolute;top:100%;left:0;right:0;z-index:60;pointer-events:auto;min-height:calc(100dvh - 100%);background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;box-shadow:0 10px 30px rgba(20,30,45,.14);">
        <dc-import name="MobilniMenu" show-info="{{ mmInfo }}" show-contacts="{{ mmContacts }}" panel-open="{{ menuOpen }}" menu-tree="{{ menuTree }}" active="{{ menuActive }}" on-select="{{ onMenuSelect }}" info-links="{{ infoLinks }}" on-login="{{ onMenuLogin }}" currency="{{ currency }}" currencies="{{ currencyCodes }}" on-currency-change="{{ onMenuCurrency }}" debug="{{ debug }}" hint-size="100%,320px"></dc-import>
      </div>
    </sc-if>
  </div>
</header>
<sc-if value="{{ loginOpen }}" hint-placeholder-val="">
  <dc-import name="LoginPopup" open="{{ true }}" on-close="{{ closeLogin }}" debug="{{ debug }}" hint-size="0px,0px"></dc-import>
</sc-if>
<sc-if value="{{ cartOpen }}" hint-placeholder-val="">
  <dc-import name="BasketPopup" open="{{ true }}" items="{{ cartItems }}" currency="{{ currency }}" on-close="{{ closeCart }}" on-remove="{{ onCartRemove }}" on-go-to-cart="{{ onCart }}" on-back-to-shop="{{ closeCart }}" on-panel-enter="{{ onCartEnter }}" on-panel-leave="{{ onCartLeave }}" debug="{{ debug }}" hint-size="0px,0px"></dc-import>
</sc-if>
<dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;megaTab&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Megamenu&quot;},&quot;megaGroups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,href:string,items:{name:string,href:string}[]}[]&quot;,&quot;default&quot;:null},&quot;megaColumns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:2,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Megamenu&quot;},&quot;megaMaxItems&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:3,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Megamenu&quot;},&quot;debug&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;},&quot;$preview&quot;:{&quot;width&quot;:1100,&quot;height&quot;:220},&quot;contactPhone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;323 605 314&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;contactPhoneHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;tel:+420323605314&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;contactHours&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8:30–16:30&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;contactOpen&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;contactEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;obchod@vapp.cz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;contactEmailHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;mailto:obchod@vapp.cz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;currency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;CZK&quot;,&quot;EUR&quot;],&quot;default&quot;:&quot;CZK&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;currencies&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;,&quot;default&quot;:null},&quot;onCurrencyChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(code:string)=&gt;void&quot;,&quot;default&quot;:null},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Náhradní díly&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cartCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:5,&quot;tsType&quot;:&quot;number&quot;},&quot;cartTotal&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1500,&quot;tsType&quot;:&quot;number&quot;},&quot;compareCount&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;tsType&quot;:&quot;number&quot;},&quot;tabs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;,&quot;default&quot;:null},&quot;menuTree&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;,&quot;default&quot;:null},&quot;searchValue&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;,&quot;default&quot;:null},&quot;onSearchChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;,&quot;default&quot;:null},&quot;onCompare&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;,&quot;default&quot;:null},&quot;onCart&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;,&quot;default&quot;:null},&quot;onTabClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;,&quot;default&quot;:null},&quot;onLogoClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;,&quot;default&quot;:null},&quot;infoLinks&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;,&quot;default&quot;:null}}">
class Component extends DCLogic {
  // Položka menu bez potomků se doplní ze společných dat megamenu (vapp-menu.js),
  // aby mobilní menu ukazovalo stejnou hierarchii jako desktop na každé stránce.
  fillFromMega(tree, MEGA, TAB_HREF){
    if (!Array.isArray(tree) || !tree.length) return tree;
    return tree.map(n=>{
      if (!n || (Array.isArray(n.children) && n.children.length)) return n;
      const src = MEGA && MEGA[n.name] && Array.isArray(MEGA[n.name].groups) ? MEGA[n.name].groups : null;
      if (!src || !src.length) return n;
      // Akce a slevy nejsou sdružovací kategorie — v mobilním menu stojí jako poslední položka
      const rail = (MEGA[n.name] && Array.isArray(MEGA[n.name].rail)) ? MEGA[n.name].rail : [];
      const sale = rail.filter(r=>r && r.tone === 'sale').map(r=>({ name:r.name, href:r.href }));
      return Object.assign({}, n, {
        href: n.href && n.href !== '#' ? n.href : ((TAB_HREF && TAB_HREF[n.name]) || n.href),
        children: src.map(g=>({
          name: g.name, href: g.href,
          children: Array.isArray(g.items) && g.items.length ? g.items.map(i=>({ name:i.name, href:i.href })) : undefined
        })).concat(sale)
      });
    });
  }
  // Stránka bez vlastního menuTree (homepage, servis, poradna…) dostane strom
  // poskládaný ze společných dat megamenu, aby mobilní menu bylo všude stejné.
  treeFromMega(labels, MEGA, TAB_HREF){
    if (!MEGA || !Object.keys(MEGA).length) return null;
    return (labels || []).map(name=>({ name, href: (TAB_HREF && TAB_HREF[name]) || '#' }));
  }
  state = { menuOpen:false, searchOpen:false, loginOpen:false, cartOpen:false, currency:'CZK', megaTab:null };
  // megamenu: otevírá hover nebo fokus tabu, zavírá Escape, odjezd myší a klik mimo.
  // Otevřený je vždy nejvýš jeden tab — drží se jeho label, ne boolean.
  openMega(label){
    clearTimeout(this._megaT);
    // bez labelu (najetí na panel) jen zrušíme zavírací timer a držíme otevřený tab
    if (label === undefined){ this.fitMega(); return; }
    if(this.state.megaTab !== label) this.setState({ megaTab: label }, ()=>this.fitMega());
    else this.fitMega();
  }
  fitMega(){
    const apply = ()=>{
      const el = document.getElementById('hd-mega');
      if (!el) return;
      const top = el.getBoundingClientRect().top;
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      el.style.maxHeight = Math.max(240, Math.round(vh - top - 16)) + 'px';
      el.style.overflowY = 'auto';
      el.style.overscrollBehavior = 'contain';
    };
    apply();
    if (!this._onFitMega){
      this._onFitMega = ()=>{ if (this.state.megaTab) apply(); };
      window.addEventListener('resize', this._onFitMega);
      window.addEventListener('scroll', this._onFitMega, { passive:true });
      if (window.visualViewport) window.visualViewport.addEventListener('resize', this._onFitMega);
    }
  }
  unbindFitMega(){
    if (!this._onFitMega) return;
    window.removeEventListener('resize', this._onFitMega);
    window.removeEventListener('scroll', this._onFitMega);
    if (window.visualViewport) window.visualViewport.removeEventListener('resize', this._onFitMega);
    this._onFitMega = null;
  }
  closeMega(delay){
    clearTimeout(this._megaT);
    this._megaT = setTimeout(()=>{ if(this.state.megaTab){ this.unbindFitMega(); this.setState({ megaTab:null }); } }, delay || 0);
  }
  _menuWas = false;
  lockScroll(on){ try{ document.body.style.overflow = on ? 'hidden' : ''; }catch(e){} }
  componentDidMount(){
    this._onKey = (e)=>{ if(e.key!=='Escape') return;
      if(this.state.megaTab){ this.closeMega(0); const t=document.querySelector('.hd-tab[aria-expanded="true"]'); if(t&&t.focus) t.focus(); return; }
      if(this.state.menuOpen){ this.closeMenu(); }
      else if(this.state.searchOpen){ this.setState({ searchOpen:false }); const b=document.getElementById('hd-search-toggle'); if(b&&b.focus) b.focus(); } };
    document.addEventListener('keydown', this._onKey, true);
    this._onMegaDoc = (e)=>{
      if(!this.state.megaTab) return;
      const p = document.getElementById('hd-mega');
      if(p && p.contains(e.target)) return;
      if(e.target && e.target.closest && e.target.closest('.hd-tab')) return;
      this.closeMega(0);
    };
    document.addEventListener('click', this._onMegaDoc, true);
    this._onMegaReady = ()=>this.forceUpdate();
    window.addEventListener('vapp-mega-ready', this._onMegaReady);
    if (!window.VAPP_MEGA) this._megaPoll = setInterval(()=>{ if(window.VAPP_MEGA){ clearInterval(this._megaPoll); this.forceUpdate(); } }, 120);
  }
  componentWillUnmount(){ this.lockScroll(false); this.unbindFit(); clearTimeout(this._megaT); clearInterval(this._megaPoll); if(this._onMegaReady) window.removeEventListener('vapp-mega-ready', this._onMegaReady); this.unbindFitMega(); if(this._onKey) document.removeEventListener('keydown', this._onKey, true); if(this._onMegaDoc) document.removeEventListener('click', this._onMegaDoc, true); }
  componentDidUpdate(prevProps, prevState){

    // runtime nedodává spolehlivý prevState — poslední stav si držíme na instanci
    const now = !!this.state.menuOpen;
    if (this._menuWas === now) return;
    this._menuWas = now;
    this.lockScroll(now);
    const el = document.getElementById(now ? 'hd-mobile-menu' : 'hd-burger');
    if (el && el.focus) { try { el.focus({ preventScroll:true }); } catch(e){ el.focus(); } }
    if (now) this.fitMenu(); else this.unbindFit();
  }
  closeMenu(){ this.setState({ menuOpen:false }); }

  // procentní max-height se v absolutně pozicovaném panelu nevyhodnotí (rodič má auto výšku),
  // proto dostupnou výšku měříme a zapisujeme inline
  fitMenu(){
    const apply = ()=>{
      const el = document.getElementById('hd-mobile-menu');
      if (!el) return;
      const top = el.getBoundingClientRect().top;
      const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      el.style.maxHeight = Math.max(200, Math.round(vh - top)) + 'px';
    };
    apply();
    if (!this._onFit){
      this._onFit = ()=>{ if (this.state.menuOpen) apply(); };
      window.addEventListener('resize', this._onFit);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', this._onFit);
    }
  }
  unbindFit(){
    if (!this._onFit) return;
    window.removeEventListener('resize', this._onFit);
    if (window.visualViewport) window.visualViewport.removeEventListener('resize', this._onFit);
    this._onFit = null;
  }
  renderVals(){
    const P = this.props;
    const active = P.active ?? 'Náhradní díly';
    const labels = P.tabs || ['Přívěsy','Náhradní díly','Servis','Půjčovna','Poradna'];
    const onTab = P.onTabClick;
    const infoLinks = P.infoLinks || ['Doprava a platba','Obchodní podmínky','O nás','Kontakty'];
    const TAB_HREF = { 'Přívěsy':'privesy-V1.dc.html', 'Náhradní díly':'nahradnidily.dc.html', 'Servis':'servis.dc.html', 'Poradna':'poradna.dc.html' };
    // data megamenu: prop pro svůj tab (stránka má strukturu živě) přebije společný default
    const MEGA = (window.VAPP_MEGA && typeof window.VAPP_MEGA === 'object') ? window.VAPP_MEGA : {};
    const ownTab = P.megaTab || '';
    const ownGroups = Array.isArray(P.megaGroups) && P.megaGroups.length ? P.megaGroups : null;
    // záznam v datech smí být pole skupin, nebo objekt { groups, rail }
    const entry = (label)=>{
      const e = MEGA[label];
      if (Array.isArray(e)) return { groups:e, rail:null, foot:null };
      return (e && typeof e === 'object')
        ? { groups: e.groups, rail: e.rail, foot: e.foot }
        : { groups:null, rail:null, foot:null };
    };
    const groupsFor = (label)=>{
      if (label && label === ownTab && ownGroups) return ownGroups;
      const g = entry(label).groups;
      return (Array.isArray(g) && g.length) ? g : null;
    };
    const railFor = (label)=>{
      const own = Array.isArray(P.megaRail) && P.megaRail.length ? P.megaRail : null;
      if (label && label === ownTab && own) return own;
      const r = entry(label).rail;
      return (Array.isArray(r) && r.length) ? r : null;
    };
    const megaTabOpen = this.state.megaTab;
    const megaGroups = groupsFor(megaTabOpen);
    const megaRail = railFor(megaTabOpen);
    const hasMega = (label)=>!!groupsFor(label);
    const megaFoot = entry(megaTabOpen).foot || {};
    const megaOpen = hasMega(megaTabOpen);
    const tabs = labels.map(label=>{
      const on = label === active;
      const href = TAB_HREF[label] || '#';
      const mega = hasMega(label);
      return {
        label, cls: 'hd-tab hd-i', current: on ? 'page' : undefined, href,
        expanded: mega ? (megaTabOpen === label ? 'true' : 'false') : undefined,
        onEnter: mega ? (()=>this.openMega(label)) : (()=>this.closeMega(0)),
        onLeave: mega ? (()=>this.closeMega(160)) : undefined,
        onFocus: mega ? (()=>this.openMega(label)) : (()=>this.closeMega(0)),
        onClick: (e)=>{ if(e&&e.preventDefault) e.preventDefault(); this.closeMega(0); if (href !== '#' && !on){ window.location.href = href; return; } if(onTab) onTab(label); },
        style:'display:flex;align-items:center;align-self:stretch;font-size:18px;font-weight:700;padding:13px 2px;cursor:pointer;border-bottom:3px solid '+(on?'#1E5AA8':'transparent')+';color:'+(on?'#1E5AA8':'#3A424C')+';' };
    });
    const cartCount = P.cartCount;
    const compareCount = P.compareCount || 0;
    // Jediná platná verze hlavičky (v UI „V3"): tmavý pás USP nad hlavičkou, bez tmavého topbaru.
    const searchOpen = this.state.searchOpen;
    const codes = Array.isArray(P.currencies) && P.currencies.length ? P.currencies : ['CZK','EUR'];
    const curControlled = typeof P.onCurrencyChange === 'function';
    const currency = curControlled ? (P.currency || codes[0]) : this.state.currency;
    const setCurrency = (code)=>{ if (curControlled) P.onCurrencyChange(code); else this.setState({ currency: code }); };
    return {
      showKb: true, showMail: true, showSearchAct: true,
      // porovnávání se nepoužívá — ikona je skrytá, kód zůstává (prop showCompareAction ji vrátí)
      showCompareAct: P.showCompareAction === true,
      // servisní odkazy jsou jen v patičce, kontaktní blok v mobilním menu zůstává
      mmInfo: false, mmContacts: true,
      rootCls: 'hd-v4',
      contactEmail: P.contactEmail ?? 'obchod@vapp.cz',
      contactEmailHref: P.contactEmailHref ?? ('mailto:' + (P.contactEmail ?? 'obchod@vapp.cz')),
      currencyCodes: codes, onMenuCurrency: (code)=>setCurrency(code), currency,
      loginOpen: this.state.loginOpen,
      openLogin: ()=>{ const f = P.onLogin; if (typeof f === 'function') f(); else this.setState({ loginOpen:true }); },
      closeLogin: ()=>{ this.setState({ loginOpen:false }); setTimeout(()=>{ const b=document.getElementById('hd-login'); if(b&&b.offsetParent!==null&&b.focus) b.focus(); },0); },
      onMenuLogin: ()=>{ const f = P.onLogin; this.setState({ menuOpen:false, loginOpen: typeof f === 'function' ? false : true }); if (typeof f === 'function') f(); },
      searchOpen, searchExpanded: searchOpen ? 'true' : 'false',
      onSearchFieldFocus: ()=>{ if (this.state.menuOpen) this.closeMenu(); },
      toggleSearch: ()=>{
        const next = !this.state.searchOpen;
        this.setState({ searchOpen: next, menuOpen: next ? false : this.state.menuOpen });
        if (!next) return;
        // fokus si při mountu nastaví samo Vyhledavani (prop autofocus)
      },
      contactPhone: P.contactPhone ?? '323 605 314',
      contactPhoneHref: P.contactPhoneHref ?? 'tel:+420323605314',
      contactHours: P.contactHours ?? '8:30–16:30',
      contactOpen: P.contactOpen ?? true,
      searchValue: P.searchValue, onSearchChange: P.onSearchChange,
      compareAria: compareCount>0 ? ('Porovnat — ' + compareCount + (compareCount===1?' produkt':(compareCount<5?' produkty':' produktů'))) : 'Porovnat produkty',
      onNav: (e)=>{ if(e&&e.preventDefault) e.preventDefault(); },
      onLogoNav: (e)=>{ const f=P.onLogoClick; if (typeof f === 'function'){ if(e&&e.preventDefault) e.preventDefault(); f(e); } },
      logoHref: P.logoHref ?? 'index.dc.html',
      onCompare: P.onCompare || (()=>{}),
      onCart: P.onCart || (()=>{}),
      cartOpen: this.state.cartOpen,
      cartItems: Array.isArray(P.cartItems) ? P.cartItems : null,
      onCartRemove: typeof P.onCartRemove === 'function' ? P.onCartRemove : null,
      // klik košík připne (zavře ho až křížek, overlay nebo Escape), hover jen dočasně otevírá
      onCartClick: ()=>{ clearTimeout(this._cartT); this._cartPinned = true; this.setState({ cartOpen:true }); },
      onCartEnter: ()=>{
        clearTimeout(this._cartT);
        if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
        if (this.state.cartOpen) return;
        this._cartT = setTimeout(()=>this.setState({ cartOpen:true }), 120);
      },
      onCartLeave: ()=>{
        clearTimeout(this._cartT);
        if (this._cartPinned) return;
        if (!window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
        this._cartT = setTimeout(()=>this.setState({ cartOpen:false }), 400);
      },
      closeCart: ()=>{ clearTimeout(this._cartT); this._cartPinned = false; this.setState({ cartOpen:false }); },
      onLogoClick: P.onLogoClick || (()=>{}),
      cartCount, cartTotal: P.cartTotal, compareCount, showCompare: compareCount>0,
      tabs,
      megaOpen, megaGroups, megaRail,
      megaAllLabel: megaFoot.allLabel || 'Všechny náhradní díly',
      megaAllHref: megaFoot.allHref || '#',
      megaCatsLabel: megaFoot.catsLabel || 'Všechny kategorie',
      megaCatsHref: megaFoot.catsHref || megaFoot.allHref || '#',
      megaTab: megaTabOpen || '',
      megaColumns: P.megaColumns ?? 4, megaMaxItems: P.megaMaxItems ?? 6,
      onMegaEnter: ()=>this.openMega(), onMegaLeave: ()=>this.closeMega(160),
      menuOpen: this.state.menuOpen, menuClosed: !this.state.menuOpen,
      menuExpanded: this.state.menuOpen ? 'true' : 'false',
      menuLabel: this.state.menuOpen ? 'Zavřít menu' : 'Otevřít menu',
      toggleMenu:()=>this.setState({ menuOpen:!this.state.menuOpen }),

      onMenuKey:(e)=>{ if(e.key==='Escape'){ e.preventDefault(); this.closeMenu(); } },
      infoLinks, infoItems: infoLinks.map(t=>({ t, onClick:(e)=>{ if(e&&e.preventDefault) e.preventDefault(); } })),
      menuTree: this.fillFromMega(P.menuTree || this.treeFromMega(labels, MEGA, TAB_HREF), MEGA, TAB_HREF), menuActive: active,
      onMenuSelect: (t)=>{ this.closeMenu(); if(onTab) onTab(t); },
    };
  }
}


// DebugBar: prop debug -> šablona
(function(){ const rv = Component.prototype.renderVals;
  Component.prototype.renderVals = function(){ const v = rv ? (rv.call(this) || {}) : {}; if (v.debug === undefined) v.debug = this.props.debug ?? true; return v; }; })();
</script>

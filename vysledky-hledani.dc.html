<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0!important;padding:0!important;background:#F7F9FB;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  #dc-root{margin:0!important;padding:0!important;width:100%!important;max-width:none!important;border:0!important;}
  #dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
  a{color:#15181C;text-decoration:none;}
  a:hover{color:#1E5AA8;}
  .a11y-i{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;line-height:inherit;text-decoration:none;cursor:pointer;}
  .a11y-i:focus-visible{outline:2px solid #1E5AA8;outline-offset:2px;}
  .vp-in{max-width:1560px;margin-left:auto;margin-right:auto;padding-left:32px;padding-right:32px;}
  @media (max-width:819px){ .vp-in{padding-left:16px;padding-right:16px;} }
  /* užší hlavní sloupec (rail 300 px) — sloupců je o jeden méně než na výpisu */
  .p-grid{display:grid;gap:20px;grid-template-columns:repeat(3,1fr);}
  @media (min-width:1560px){ .p-grid{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:819px){ .p-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:549px){ .p-grid{grid-template-columns:1fr;} }
  .a-grid{display:grid;gap:20px;grid-template-columns:repeat(3,1fr);}
  @media (max-width:819px){ .a-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:549px){ .a-grid{grid-template-columns:1fr;} }
  @media (max-width:999px){ .sr-cols{grid-template-columns:minmax(0,1fr) !important;gap:20px !important;} }
  .sr-crow{transition:background .12s;}
  .sr-crow:hover{background:#F2F4F7;}
  .a-card{transition:box-shadow .15s;}
  .a-card:hover{box-shadow:0 6px 20px rgba(20,47,86,.10);}
  .sr-h1{font-size:36px;font-weight:700;line-height:1.15;letter-spacing:-.02em;margin:0;}
  .sr-h2{font-size:28px;font-weight:700;line-height:1.2;letter-spacing:-.01em;margin:0;}
  @media (max-width:819px){ .sr-h1{font-size:26px;} .sr-h2{font-size:22px;} }
</style>
</helmet>
<div data-screen-label="Výsledky hledání" style="background:#F7F9FB;min-height:100vh;width:100%;margin:0;padding:0;">

  <dc-import name="Hlavicka" currency="{{ currency }}" on-currency-change="{{ onCurrency }}" contact-phone="323 605 314" contact-phone-href="tel:+420323605314" contact-hours="8:30–16:30" contact-open="{{ true }}" search-value="{{ q }}" on-search-change="{{ onSearchChange }}" hint-size="100%,150px"></dc-import>

  <main class="vp-in" style="padding-top:20px;padding-bottom:40px;">
    <h1 class="sr-h1">Výsledky hledání „{{ q }}“</h1>
    <p style="margin:8px 0 0;font-size:16px;line-height:1.6;color:#5A626C;">{{ summary }}</p>

      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:56px 20px;text-align:center;">

        <div style="font-size:16px;font-weight:700;">Nic jsme nenašli</div>
        <div style="font-size:14px;color:#5A626C;max-width:400px;">Zkuste obecnější výraz, jiné označení dílu nebo objednací číslo.</div>
      </div>
    </sc-if>

    <div class="sr-cols" style="display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start;">
    <div style="min-width:0;">
    <sc-if value="{{ hasProducts }}" hint-placeholder-val="{{ true }}">
      <section aria-label="Produkty" style="margin-top:28px;">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px;">
          <h2 class="sr-h2">Produkty</h2>
          <span style="font-size:13px;font-weight:500;color:#666E78;">{{ productCount }}</span>
        </div>
        <div class="p-grid">
          <sc-for list="{{ products }}" as="p" hint-placeholder-count="8">

          </sc-for>
        </div>
      </section>
    </sc-if>

    </div>

    <div style="min-width:0;margin-top:28px;display:flex;flex-direction:column;gap:20px;">
    <sc-if value="{{ hasCats }}" hint-placeholder-val="{{ true }}">
      <section aria-label="Kategorie" style="min-width:0;">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px;">
          <h2 class="sr-h2">Kategorie</h2>
          <span style="font-size:13px;font-weight:500;color:#666E78;">{{ catCount }}</span>
        </div>
        <div style="background:#fff;border-radius:8px;padding:6px 0 8px;">
        <sc-for list="{{ categories }}" as="c" hint-placeholder-count="5">
          <a class="sr-crow a11y-i" href="{{ c.href }}" style="display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 16px;">
            <span style="flex:1;min-width:0;font-size:15px;font-weight:600;color:#15181C;line-height:1.3;">{{ c.name }}</span>
            <span style="flex:none;font-size:13px;color:#666E78;">{{ c.count }}</span>
            <span style="flex:none;display:inline-flex;color:#5189CC;"><dc-import name="Ikony" icon-name="chevron-right" size="18" hint-size="18px,18px"></dc-import></span>
          </a>
        </sc-for>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{ hasArticles }}" hint-placeholder-val="{{ true }}">
      <section aria-label="Poradna" style="min-width:0;">
        <div style="display:flex;align-items:baseline;gap:12px;margin-bottom:14px;">
          <h2 class="sr-h2">Poradna</h2>
          <span style="font-size:13px;font-weight:500;color:#666E78;">{{ artCount }}</span>
        </div>
        <div style="background:#fff;border-radius:8px;padding:6px 0 8px;">
        <sc-for list="{{ articles }}" as="a" hint-placeholder-count="4">
          <a class="sr-crow a11y-i" href="{{ a.href }}" style="display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 16px;">
            <span style="flex:1;min-width:0;">
              <span style="display:block;font-size:15px;font-weight:600;color:#15181C;line-height:1.3;">{{ a.name }}</span>
              <span style="display:block;font-size:13px;color:#666E78;">{{ a.rubrika }}</span>
            </span>
            <span style="flex:none;display:inline-flex;color:#5189CC;"><dc-import name="Ikony" icon-name="chevron-right" size="18" hint-size="18px,18px"></dc-import></span>
          </a>
        </sc-for>
        <a class="sr-crow a11y-i" href="poradna.dc.html" style="display:flex;align-items:center;gap:8px;padding:10px 16px;font-size:14px;font-weight:700;color:#C5232B;"><dc-import name="Ikony" icon-name="book" size="18" hint-size="18px,18px"></dc-import>Celá poradna</a>
        </div>
      </section>
    </sc-if>
    </div>
  </main>

  <div class="vp-in" style="margin-top:8px;">
    <dc-import name="Usp" variant="sloupce" docs="{{ false }}" debug="{{ debug }}" hint-size="100%,150px"></dc-import>
  </div>
  <div style="margin-top:10px;">
    <dc-import name="Paticka" bare="true" hint-size="100%,600px"></dc-import>
  </div>
  <dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</div>
</x-dc>

      onCurrency:(code)=>this.setState({ currency:code }),
      onSearchChange:(v)=>this.setState({ q:v }),
      summary: total===0 ? 'Žádný výsledek' : (total+' '+this.plural(total,'výsledek','výsledky','výsledků')+' — '+prods.length+' '+this.plural(prods.length,'produkt','produkty','produktů')+', '+cats.length+' '+this.plural(cats.length,'kategorie','kategorie','kategorií')+', '+arts.length+' '+this.plural(arts.length,'článek','články','článků')),
      nothing: total===0,
      hasProducts: prods.length>0, productCount: prods.length+' '+this.plural(prods.length,'položka','položky','položek'),
      products,
      hasCats: cats.length>0, catCount: cats.length+' '+this.plural(cats.length,'kategorie','kategorie','kategorií'),
      categories: cats.map(c=>({ name:c.name, image:c.image, count:c.count, href:c.href, subs:[] })),
      noBrands: [],
      hasArticles: arts.length>0, artCount: arts.length+' '+this.plural(arts.length,'článek','články','článků'),
      // prototyp: všechny články vedou na jediný hotový detail
      articles: arts.map(a=>({ name:a.name, rubrika:a.rubrika, href:'clanek-tachograf.dc.html',
        imgStyle:'display:block;aspect-ratio:16/10;background:#F2F4F7 url("./'+a.image+'") center/cover no-repeat;' })),
      debug: this.props.debug ?? true
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  .mm-i{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;line-height:inherit;text-decoration:none;cursor:pointer;}
  .mm-i:focus-visible{outline:2px solid #1E5AA8;outline-offset:2px;}
  .mm-in{max-width:1560px;margin:0 auto;padding:0 32px;}
  @media (max-width:819px){ .mm-in{padding:0 16px;} }
  /* sloupce: XL a XXL podle propu, L a M tři, S dva, XS a XXS jeden */
  .mm-grid{display:grid;gap:28px 32px;grid-template-columns:repeat(var(--mm-cols,4),1fr);}
  @media (max-width:1149px){ .mm-grid{grid-template-columns:repeat(3,1fr);} }
  @media (max-width:819px){ .mm-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:549px){ .mm-grid{grid-template-columns:1fr;} }
  .mm-head{transition:color .12s;} .mm-head:hover{color:#1E5AA8 !important;}
  .mm-row{transition:background .12s,color .12s;}
  .mm-row:hover{background:#F2F4F7 !important;color:#1E5AA8 !important;}
  .mm-more{transition:background .12s,color .12s;}
  .mm-more:hover{background:#EFF4FB !important;color:#1A4A8A !important;}
  /* pravý sloupec: přes celou výšku panelu, oddělený svislou linkou */
  .mm-body{display:flex;align-items:stretch;gap:32px;}
  .mm-rail{flex:0 0 260px;min-width:0;border-left:1px solid #F2F4F7;padding-left:32px;display:flex;flex-direction:column;gap:8px;}
  @media (max-width:1149px){ .mm-rail{flex-basis:220px;padding-left:24px;} .mm-body{gap:24px;} }
  .mm-railrow{transition:background .12s,color .12s;}
  .mm-railrow:hover{background:#F2F4F7 !important;color:#1E5AA8 !important;}
  .mm-salerow{transition:background .12s;}
  .mm-salerow:hover{background:#FAD9DA !important;}
</style>
</helmet>
<div style="background:#FFFFFF;border-top:1px solid #F2F4F7;box-shadow:0 10px 30px rgba(20,30,45,.14);">
  <div class="mm-in" style="padding-top:24px;padding-bottom:24px;">
    <h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;margin:0;">{{ heading }}</h2>
    <div class="mm-body">
    <div class="mm-grid" style="flex:1;min-width:0;{{ gridStyle }}">
      <sc-for list="{{ blocks }}" as="blk" hint-placeholder-count="8">
        <div style="display:flex;align-items:flex-start;gap:12px;min-width:0;">
          <sc-if value="{{ blk.hasPhoto }}" hint-placeholder-val="{{ true }}">
            <img src="{{ blk.image }}" alt="" width="48" height="48" loading="lazy" style="flex:none;width:48px;height:48px;object-fit:contain;">
          </sc-if>
          <sc-if value="{{ blk.hasIcon }}" hint-placeholder-val="">
            <span aria-hidden="true" style="flex:none;width:44px;height:44px;border-radius:999px;background:#EFF4FB;display:flex;align-items:center;justify-content:center;color:#1E5AA8;"><dc-import name="Ikony" icon-name="{{ blk.icon }}" size="24" hint-size="24px,24px"></dc-import></span>
          </sc-if>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;">
          <a class="mm-i mm-head" href="{{ blk.href }}" style="display:block;font-size:16px;font-weight:700;line-height:1.3;color:#15181C;">{{ blk.name }}</a>
          <div style="display:flex;flex-direction:column;gap:2px;">
            <sc-for list="{{ blk.items }}" as="it" hint-placeholder-count="6">
              <a class="mm-i mm-row" href="{{ it.href }}" style="display:block;font-size:14px;font-weight:500;line-height:1.5;color:#5A626C;padding:5px 8px;margin:0 -8px;border-radius:6px;">{{ it.name }}</a>
            </sc-for>
          </div>
          <sc-if value="{{ blk.hasMore }}" hint-placeholder-val="">
            <a class="mm-i mm-more" href="{{ blk.href }}" style="display:inline-flex;align-items:center;gap:4px;align-self:flex-start;min-height:32px;padding:0 8px;margin:0 -8px;border-radius:6px;font-size:14px;font-weight:700;color:#1E5AA8;">{{ blk.moreLabel }}<span aria-hidden="true" style="display:inline-flex;"><dc-import name="Ikony" icon-name="chevron-right" size="18" hint-size="18px,18px"></dc-import></span></a>
          </sc-if>
          </div>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ hasRail }}" hint-placeholder-val="{{ true }}">
      <nav class="mm-rail" aria-label="{{ railLabel }}">
        <span style="font-size:13px;font-weight:700;line-height:1.4;text-transform:uppercase;letter-spacing:.06em;color:#666E78;">{{ railLabel }}</span>
        <sc-for list="{{ railItems }}" as="ri" hint-placeholder-count="4">
          <a class="mm-i {{ ri.cls }}" href="{{ ri.href }}" style="{{ ri.style }}"><sc-if value="{{ ri.hasIcon }}" hint-placeholder-val=""><span aria-hidden="true" style="display:inline-flex;flex:none;"><dc-import name="Ikony" icon-name="{{ ri.iconName }}" size="18" hint-size="18px,18px"></dc-import></span></sc-if>{{ ri.name }}</a>
        </sc-for>
      </nav>
    </sc-if>
    </div>
  </div>
</div>
<dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:460},&quot;groups&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,href:string,items:{name:string,href:string}[]}[]&quot;,&quot;default&quot;:null},&quot;heading&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Náhradní díly&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;maxItems&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:6,&quot;min&quot;:3,&quot;max&quot;:12,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Zobrazení&quot;},&quot;columns&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:4,&quot;min&quot;:2,&quot;max&quot;:5,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Zobrazení&quot;},&quot;showThumbs&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Zobrazení&quot;},&quot;railItems&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{name:string,href:string,tone?:string,iconName?:string}[]&quot;,&quot;default&quot;:null},&quot;railLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nejhledanější&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;allLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Všechny náhradní díly&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pata&quot;},&quot;allHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pata&quot;},&quot;catsLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Všechny kategorie&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pata&quot;},&quot;catsHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;#&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Pata&quot;},&quot;debug&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;}}">
class Component extends DCLogic {
  DEMO = [
    { name:'Nápravy a díly náprav', href:'#', image:'uploads/napravy-a-brzdy.jpg', icon:'ikona-napravy-kompletni.svg', items:[
      { name:'Nápravy kompletní', href:'#' }, { name:'Díly náprav', href:'#' } ] },
    { name:'Elektro, svítilny, odrazky', href:'#', image:'uploads/elektro-a-osvetleni.jpg', items:[
      { name:'Baterie, nabíječky a příslušenství', href:'#' }, { name:'Blinkry', href:'#' },
      { name:'Brzdové svítilny', href:'#' }, { name:'Couvačky a mlhovky', href:'#' },
      { name:'Držáky svítilen a odrazek', href:'#' }, { name:'Kabely a kabeláže', href:'#' },
      { name:'Majáky a výstražné svítilny', href:'#' }, { name:'Obrysové svítilny', href:'#' },
      { name:'Zásuvky, zástrčky, konektory', href:'#' } ] },
    { name:'Pneu, kola, disky', href:'#', image:'uploads/kola-a-pneumatiky.jpg', items:[
      { name:'Disky kol', href:'#' }, { name:'Kompletní kola', href:'#' }, { name:'Pneu', href:'#' },
      { name:'Pneu, kola, disky 8"', href:'#' }, { name:'Pneu, kola, disky 10"', href:'#' },
      { name:'Pneu, kola, disky 13"', href:'#' }, { name:'Příslušenství kol a pneumatik', href:'#' } ] },
    { name:'Doplňky a údržba', href:'#', image:'uploads/doplnky.jpg', items:[
      { name:'Boxy na nářadí a držáky boxů', href:'#' }, { name:'Doplňky k přívěsům', href:'#' },
      { name:'Plachty a příslušenství', href:'#' }, { name:'Pomůcky pro údržbu', href:'#' } ] }
  ];
  DEMO_RAIL = [
    { name:'Plynové vzpěry', href:'#' },
    { name:'Nájezdové brzdy', href:'#' },
    { name:'Kabeláž a zásuvky', href:'#' },
    { name:'Pneumatiky s diskem', href:'#' },
    { name:'Akce a slevy', href:'#', tone:'sale', iconName:'discount' }
  ];
  renderVals(){
    const P = this.props;
    const src = (Array.isArray(P.groups) && P.groups.length) ? P.groups : this.DEMO;
    const max = Math.max(1, P.maxItems ?? 6);
    const cols = Math.min(5, Math.max(2, P.columns ?? 4));
    const thumbs = (P.showThumbs ?? true) !== false;
    const rail = Array.isArray(P.railItems) ? P.railItems : (src === this.DEMO ? this.DEMO_RAIL : []);
    return {
      heading: P.heading || 'Náhradní díly',
      allLabel: P.allLabel || 'Všechny náhradní díly',
      allHref: P.allHref || '#',
      catsLabel: P.catsLabel || 'Všechny kategorie',
      catsHref: P.catsHref || P.allHref || '#',
      gridStyle: '--mm-cols:' + cols + ';',
      hasRail: rail.length > 0,
      railLabel: P.railLabel || 'Nejhledanější',
      railItems: rail.map(it=>{
        const sale = it.tone === 'sale';
        return {
          name: it.name, href: it.href || '#',
          cls: sale ? 'mm-salerow' : 'mm-railrow',
          hasIcon: !!it.iconName, iconName: it.iconName || 'discount',
          style: 'display:flex;align-items:center;gap:8px;font-size:14px;font-weight:'
            + (sale ? '700' : '500') + ';line-height:1.5;padding:5px 8px;margin:0 -8px;border-radius:6px;color:'
            + (sale ? '#C5232B;background:#FDF1F1;' : '#5A626C;')
        };
      }),
      blocks: src.map(g=>{
        const items = Array.isArray(g.items) ? g.items : [];
        const rest = Math.max(0, items.length - max);
        const img = g.image ? (String(g.image).indexOf('/') === 0 || /^\.\//.test(g.image) ? g.image : './' + g.image) : '';
        const photo = thumbs && !!img;
        return {
          name: g.name, href: g.href || '#',
          image: img, hasPhoto: photo,
          icon: g.icon || 'layout-grid', hasIcon: thumbs && !photo,
          items: items.slice(0, max).map(it=>({ name: it.name, href: it.href || '#' })),
          hasMore: rest > 0,
          moreLabel: 'Zobrazit vše (' + items.length + ')'
        };
      })
    };
  }
}
</script>
</body>
</html>

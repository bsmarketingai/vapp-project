<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#F7F9FB;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  body{padding:24px;}
</style>
</helmet>
<sc-if value="{{ single }}" hint-placeholder-val="">
  <span style="{{ wrapStyle }}">
    <sc-if value="{{ isIn }}" hint-placeholder-val=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.8 10A10 10 0 1 1 17 3.34"></path><path d="m9 11 3 3L22 4"></path></svg></sc-if>
    <sc-if value="{{ isOut }}" hint-placeholder-val=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6M9 9l6 6"></path></svg></sc-if>
    <sc-if value="{{ isReq }}" hint-placeholder-val=""><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></sc-if>{{ text }}</span>
</sc-if>
<sc-if value="{{ gallery }}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;gap:16px;max-width:720px;">
  <div style="background:#fff;border-radius:8px;padding:28px;display:flex;gap:32px;flex-wrap:wrap;align-items:center;">
    <span style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#0B6937;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.8 10A10 10 0 1 1 17 3.34"></path><path d="m9 11 3 3L22 4"></path></svg>Skladem &gt; 15 ks</span>
    <span style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#C5232B;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6M9 9l6 6"></path></svg>Není skladem</span>
    <span style="display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:#8A919C;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>Na dotaz</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:5px;padding:2px 4px;">
    <div style="font-size:13px;line-height:1.5;color:#0B6937;"><strong>Kdy:</strong> ikona 18×18 + text bez podbarvení. Skladem = zelená, není skladem = červená, na dotaz = neutrální šedá.</div>
    <div style="font-size:13px;line-height:1.5;color:#C5232B;"><strong>Kdy ne:</strong> nepodbarvovat, nezvětšovat ikonu na 24; zelenou používat jen pro reálnou dostupnost.</div>
  </div>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:180},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;in&quot;,&quot;out&quot;,&quot;request&quot;],&quot;default&quot;:&quot;in&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Skladem &gt; 15 ks&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const P = this.props;
    const single = !!P.state;
    if (single){
      const map = {
        in:{fg:'#0B6937',def:'Skladem > 15 ks'},
        out:{fg:'#C5232B',def:'Není skladem'},
        request:{fg:'#8A919C',def:'Na dotaz'},
      };
      const v = map[P.state] || map.in;
      return { single:true, gallery:false, text: P.text || v.def,
        wrapStyle:'display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:'+v.fg+';',
        isIn:P.state==='in', isOut:P.state==='out', isReq:P.state==='request' };
    }
    return { single:false, gallery:true };
  }
}
</script>
</body>
</html>

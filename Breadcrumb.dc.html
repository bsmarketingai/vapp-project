<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#F7F9FB;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  body{padding:24px;}
  .bc-link{transition:color .12s;} .bc-link:hover{color:#1E5AA8 !important;}
</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:16px;max-width:820px;">
  <div style="background:#fff;border-radius:8px;padding:16px 24px;">
    <div style="font-size:13px;color:#8A919C;display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
      <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="3">
        <sc-if value="{{ c.sep }}" hint-placeholder-val=""><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#B4CEEC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg></sc-if>
        <span class="{{ c.cls }}" style="{{ c.style }}">{{ c.label }}</span>
      </sc-for>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:5px;padding:2px 4px;">
    <div style="font-size:13px;line-height:1.5;color:#0B6937;"><strong>Kdy:</strong> pod hlavičkou. Odkazy terciální šedé s modrým hoverem, oddělovač šipka #B4CEEC, poslední úroveň tučná tmavě modrá bez odkazu.</div>
    <div style="font-size:13px;line-height:1.5;color:#C5232B;"><strong>Kdy ne:</strong> poslední položku nedělat odkazem; nepřekračovat 4–5 úrovní.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:150},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;,&quot;default&quot;:null}}">
class Component extends DCLogic {
  renderVals(){
    const items = this.props.items || ['Úvod','Náhradní díly','Nápravy a brzdy'];
    const crumbs = [];
    items.forEach((label,i)=>{
      const last = i === items.length-1;
      crumbs.push({ sep: i>0, label,
        cls: last ? '' : 'bc-link',
        style: last
          ? 'font-weight:700;color:#173C70;cursor:default;'
          : 'color:#8A919C;cursor:pointer;' });
    });
    return { crumbs };
  }
}
</script>
</body>
</html>

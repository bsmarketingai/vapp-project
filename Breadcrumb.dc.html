<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0!important;padding:0!important;}
  #dc-root{margin:0!important;padding:0!important;width:100%!important;
           max-width:none!important;border:0!important;}
  #dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
</style>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  .bc-hit{position:relative;}
  .bc-hit::after{content:"";position:absolute;left:0;right:0;top:-3px;bottom:-3px;}
  .a11y-i{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;line-height:inherit;text-decoration:none;cursor:pointer;}
  .a11y-i:focus-visible{outline:2px solid #1E5AA8;outline-offset:2px;}

  html,body{margin:0;background:#F7F9FB;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  .bc-link{transition:color .12s;} .bc-link:hover{color:#1E5AA8 !important;}
</style>
</helmet>
<div style="{{ rootStyle }}">
  <div style="{{ barStyle }}">
    <nav aria-label="Drobečková navigace" style="font-size:13px;color:#666E78;display:flex;align-items:center;gap:7px;flex-wrap:wrap;">
      <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="3">
        <sc-if value="{{ c.sep }}" hint-placeholder-val=""><span style="color:#B4CEEC;display:inline-flex;"><dc-import name="Ikony" icon-name="chevron-right" size="18" hint-size="18px,18px"></dc-import></span></sc-if>
        <sc-if value="{{ c.isLink }}" hint-placeholder-val="{{ true }}"><a class="{{ c.cls }} a11y-i bc-hit" href="#" onClick="{{ c.onNav }}" style="{{ c.style }}">{{ c.label }}</a></sc-if>
        <sc-if value="{{ c.isLast }}" hint-placeholder-val=""><span aria-current="page" style="{{ c.style }}">{{ c.label }}</span></sc-if>
      </sc-for>
    </nav>
  </div>
  <sc-if value="{{ showNote }}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;flex-direction:column;gap:5px;padding:2px 4px;">
    <div style="font-size:13px;line-height:1.5;color:#0B6937;"><strong>Kdy:</strong> pod hlavičkou. Odkazy terciální šedé s modrým hoverem, oddělovač šipka #B4CEEC, poslední úroveň tučná tmavě modrá bez odkazu.</div>
  </div>
  </sc-if>
</div>
<dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;debug&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;},&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:150},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;,&quot;default&quot;:null},&quot;bare&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const bare = this.props.bare === true;
    const items = this.props.items || ['Úvod','Náhradní díly','Nápravy a brzdy'];
    const crumbs = [];
    items.forEach((label,i)=>{
      const last = i === items.length-1;
      crumbs.push({ sep: i>0, label, isLink: !last, isLast: last, onNav:(e)=>{ if(e&&e.preventDefault) e.preventDefault(); },
        cls: last ? '' : 'bc-link',
        style: last
          ? 'font-weight:700;color:#173C70;cursor:default;'
          : 'color:#666E78;cursor:pointer;' });
    });
    return { crumbs, showNote: !bare,
      rootStyle: bare ? '' : 'display:flex;flex-direction:column;gap:16px;max-width:820px;',
      barStyle: bare ? '' : 'background:#fff;border-radius:8px;padding:16px 24px;' };
  }
}


// DebugBar: prop debug -> šablona
(function(){ const rv = Component.prototype.renderVals;
  Component.prototype.renderVals = function(){ const v = rv ? (rv.call(this) || {}) : {}; if (v.debug === undefined) v.debug = this.props.debug ?? true; return v; }; })();
</script>
</body>
</html>

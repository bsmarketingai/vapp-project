<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  .se-wrap{position:relative;display:flex;align-items:stretch;border-radius:6px;overflow:hidden;transition:box-shadow .12s;}
  .se-native{appearance:none;-webkit-appearance:none;flex:1;min-width:0;border:0;outline:none;font-family:inherit;cursor:pointer;}
  .se-native:disabled{cursor:not-allowed;}
  .se-wrap:focus-within{box-shadow:inset 0 0 0 2px #1E5AA8 !important;}
  @media (max-width:549px){ .se-native{font-size:16px !important;} }
</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:6px;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;width:100%;">
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="">
    <label for="{{ selId }}" style="font-size:14px;font-weight:500;color:#5A626C;">{{ label }}</label>
  </sc-if>
  <div class="se-wrap" style="{{ wrapStyle }}">
    <select id="{{ selId }}" class="se-native" aria-label="{{ ariaLabel }}" value="{{ value }}" onChange="{{ onChangeNative }}" disabled="{{ disabledAttr }}" style="{{ selectStyle }}">
      <sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
        <option value="{{ o.value }}" disabled="{{ o.disabledAttr }}">{{ o.label }}</option>
      </sc-for>
    </select>
    <span aria-hidden="true" style="{{ chevStyle }}"><dc-import name="Ikony" icon-name="chevron-down" size="{{ chevSize }}" hint-size="24px,24px"></dc-import></span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:140},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ariaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Výbava&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;subtle&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;subtle&quot;,&quot;tsType&quot;:&quot;'subtle'|'outline'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;standard&quot;,&quot;tsType&quot;:&quot;'standard'|'compact'&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{value?:string,label:string,disabled?:boolean}[]&quot;,&quot;default&quot;:null},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;,&quot;default&quot;:null},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value:string)=&gt;void&quot;,&quot;default&quot;:null}}">
class Component extends DCLogic {
  DEMO = [{ value:'zakladni', label:'základní výbava' }, { value:'plachta', label:'plachta + rám 1,2 m' }, { value:'rampy', label:'nájezdové rampy' }];
  state = { demo:'zakladni' };

  renderVals(){
    const P = this.props;
    const raw = (Array.isArray(P.options) && P.options.length) ? P.options : this.DEMO;
    const controlled = Array.isArray(P.options) && P.options.length;
    const size = P.size === 'compact' ? 36 : 44;
    const variant = P.variant || 'subtle';
    const dis = P.disabled === true;
    const value = controlled ? P.value : this.state.demo;
    const onChange = controlled ? (P.onChange || (()=>{})) : ((v)=>this.setState({ demo:v }));
    const label = P.label || '';
    const selId = 'se-' + ((label || P.ariaLabel || 'select').replace(/[^a-zA-Z0-9]+/g,'-').toLowerCase());

    // subtle = výchozí pole design systému (surface.subtle), outline = zvýrazněné pole s modrým blokem
    const bg = dis ? '#F2F4F7' : (variant === 'outline' ? '#FFFFFF' : '#F2F4F7');
    const txt = dis ? '#9AA1AB' : (variant === 'outline' ? '#1E5AA8' : '#15181C');
    const ring = dis ? 'none' : (variant === 'outline' ? 'inset 0 0 0 1px #1E5AA8' : 'none');

    return {
      opts: raw.map(o=>({ value: o.value ?? o.label, label:o.label, disabledAttr: o.disabled ? true : null })),
      value, selId, label, hasLabel: !!label, ariaLabel: P.ariaLabel || label || 'Výběr',
      disabledAttr: dis ? true : null,
      onChangeNative: (e)=>onChange(e.target.value),
      wrapStyle:'width:100%;background:'+bg+';box-shadow:'+ring+';',
      selectStyle:'min-height:'+size+'px;padding:0 8px 0 16px;background:transparent;font-size:'+(size===36?14:15)+'px;font-weight:700;color:'+txt+';',
      chevSize: size === 36 ? 18 : 24,
      chevStyle: variant === 'outline'
        ? 'flex:none;width:52px;background:'+(dis?'#D5DAE0':'#1E5AA8')+';color:#FFFFFF;display:flex;align-items:center;justify-content:center;pointer-events:none;'
        : 'flex:none;width:'+size+'px;color:'+(dis?'#9AA1AB':'#5189CC')+';display:flex;align-items:center;justify-content:center;pointer-events:none;'
    };
  }
}

</script>
</body>
</html>

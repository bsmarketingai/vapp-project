<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  .se-btn{appearance:none;-webkit-appearance:none;border:0;margin:0;font:inherit;text-align:left;cursor:pointer;}
  .se-btn:disabled{cursor:not-allowed;}
  .se-btn:focus-visible{outline:none;box-shadow:inset 0 0 0 2px #1E5AA8 !important;}
  .se-opt{transition:background 120ms ease;}
  .se-opt[aria-disabled="true"]{cursor:not-allowed;}
  @media (hover:hover) and (pointer:fine){ .se-opt:not([aria-disabled="true"]):hover{background:#F2F4F7;} }
  .se-opt.se-act{background:#F2F4F7;}
  @keyframes seIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){ .se-list{animation:none !important;} }
  @media (max-width:549px){ .se-val,.se-opt-l{font-size:16px !important;} }
</style>
</helmet>
<div ref="{{ rootRef }}" style="display:flex;flex-direction:column;gap:6px;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;width:100%;position:relative;">
  <sc-if value="{{ hasLabel }}" hint-placeholder-val="">
    <span id="{{ labelId }}" style="font-size:14px;font-weight:500;color:#5A626C;">{{ label }}</span>
  </sc-if>
  <button type="button" ref="{{ btnRef }}" class="se-btn" id="{{ btnId }}" role="combobox" aria-haspopup="listbox" aria-expanded="{{ expanded }}" aria-controls="{{ listId }}" aria-activedescendant="{{ activeDesc }}" aria-label="{{ btnAria }}" disabled="{{ disabledAttr }}" onClick="{{ onToggle }}" onKeyDown="{{ onBtnKey }}" style="{{ btnStyle }}">
    <span class="se-val" style="{{ valStyle }}">{{ currentLabel }}</span>
    <span aria-hidden="true" style="{{ chevStyle }}"><span style="{{ chevRot }}"><dc-import name="Ikony" icon-name="chevron-down" size="{{ chevSize }}" hint-size="24px,24px"></dc-import></span></span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="">
    <ul class="se-list" id="{{ listId }}" role="listbox" ref="{{ listRef }}" aria-label="{{ btnAria }}" onMouseDown="{{ keepFocus }}" style="position:absolute;left:0;right:0;top:{{ listTop }};z-index:20;margin:0;padding:6px;list-style:none;background:#FFFFFF;border-radius:8px;box-shadow:0 10px 30px rgba(20,30,45,.14);max-height:320px;overflow-y:auto;outline:none;animation:seIn 120ms ease;">
      <sc-for list="{{ opts }}" as="o" hint-placeholder-count="3">
        <li id="{{ o.id }}" class="{{ o.cls }}" role="option" aria-selected="{{ o.selected }}" aria-disabled="{{ o.disabled }}" onClick="{{ o.onPick }}" onMouseEnter="{{ o.onHover }}" style="{{ o.style }}">
          <span class="se-opt-l" style="{{ o.labelStyle }}">{{ o.label }}</span>
          <sc-if value="{{ o.hasNote }}" hint-placeholder-val=""><span style="flex:none;font-size:14px;font-weight:500;color:#5A626C;white-space:nowrap;">{{ o.note }}</span></sc-if>
          <span aria-hidden="true" style="{{ o.checkStyle }}"><dc-import name="Ikony" icon-name="check" size="18" hint-size="18px,18px"></dc-import></span>
        </li>
      </sc-for>
    </ul>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:320},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ariaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Výbava&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;subtle&quot;,&quot;outline&quot;],&quot;default&quot;:&quot;subtle&quot;,&quot;tsType&quot;:&quot;'subtle'|'outline'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;standard&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;standard&quot;,&quot;tsType&quot;:&quot;'standard'|'compact'&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{value?:string,label:string,note?:string,disabled?:boolean}[]&quot;,&quot;default&quot;:null},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;,&quot;default&quot;:null},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(value:string)=&gt;void&quot;,&quot;default&quot;:null}}">
class Component extends DCLogic {
  DEMO = [{ value:'zakladni', label:'základní výbava (v ceně)' }, { value:'plachta', label:'plachta + rám 1,2 m (+ 14 900 Kč)' }, { value:'rampy', label:'nájezdové rampy (+ 6 200 Kč)' }, { value:'kolo', label:'rezervní kolo', disabled:true }];
  state = { demo:'zakladni', open:false, active:-1 };
  rootRef = React.createRef(); btnRef = React.createRef(); listRef = React.createRef();

  componentDidMount(){
    this._uid = 'se' + Math.random().toString(36).slice(2,8);
    this._doc = (e)=>{ if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.close(false); };
    document.addEventListener('mousedown', this._doc);
    this.forceUpdate();
  }
  componentWillUnmount(){ document.removeEventListener('mousedown', this._doc); }
  componentDidUpdate(_, prev){
    if (this.state.open && this.state.active !== prev.active) {
      const l = document.getElementById((this._uid||'se') + '-lb');
      const el = l && l.children[this.state.active];
      if (el && l){ if (el.offsetTop < l.scrollTop) l.scrollTop = el.offsetTop - 6; else if (el.offsetTop + el.offsetHeight > l.scrollTop + l.clientHeight) l.scrollTop = el.offsetTop + el.offsetHeight - l.clientHeight + 6; }
    }
  }
  model(){
    const P = this.props;
    const controlled = Array.isArray(P.options) && P.options.length;
    const raw = controlled ? P.options : this.DEMO;
    const opts = raw.map(o=>({ value: String(o.value ?? o.label), label:o.label, note:o.note || '', disabled: !!o.disabled }));
    const value = controlled ? String(P.value ?? '') : this.state.demo;
    const onChange = controlled ? (P.onChange || (()=>{})) : ((v)=>this.setState({ demo:v }));
    return { opts, value, onChange };
  }
  open(){ if (this.props.disabled) return; const { opts, value } = this.model(); let i = opts.findIndex(o=>o.value===value); if (i < 0) i = this.next(opts, -1, 1); this.setState({ open:true, active:i }); }
  close(focusBtn){ this.setState({ open:false }); if (focusBtn && this.btnRef.current) this.btnRef.current.focus(); }
  next(opts, from, d){ let i = from; for (let k=0;k<opts.length;k++){ i = (i + d + opts.length) % opts.length; if (!opts[i].disabled) return i; } return from; }
  pick(i){ const { opts, onChange } = this.model(); const o = opts[i]; if (!o || o.disabled) return; onChange(o.value); this.close(true); }

  renderVals(){
    const P = this.props;
    const { opts, value } = this.model();
    const uid = this._uid || 'se';
    const size = P.size === 'compact' ? 36 : 44;
    const fs = size === 36 ? 14 : 15;
    const variant = P.variant || 'subtle';
    const dis = P.disabled === true;
    const open = this.state.open && !dis;
    const cur = opts.find(o=>o.value===value) || opts[0] || { label:'' };
    const label = P.label || '';

    // subtle = výchozí pole design systému (surface.subtle), outline = zvýrazněné pole s modrým blokem
    const bg = dis ? '#F2F4F7' : (variant === 'outline' ? '#FFFFFF' : '#F2F4F7');
    const txt = dis ? '#9AA1AB' : (variant === 'outline' ? '#1E5AA8' : '#15181C');
    const ring = open ? 'inset 0 0 0 2px #1E5AA8' : (dis ? 'none' : (variant === 'outline' ? 'inset 0 0 0 1px #1E5AA8' : 'none'));

    const keyMove = (e)=>{
      const k = e.key; const a = this.state.active;
      if (k === 'ArrowDown'){ e.preventDefault(); this.setState({ active: this.next(opts, a, 1) }); }
      else if (k === 'ArrowUp'){ e.preventDefault(); this.setState({ active: this.next(opts, a, -1) }); }
      else if (k === 'Home'){ e.preventDefault(); this.setState({ active: this.next(opts, -1, 1) }); }
      else if (k === 'End'){ e.preventDefault(); this.setState({ active: this.next(opts, 0, -1) }); }
      else if (k === 'Enter' || k === ' '){ e.preventDefault(); if (a >= 0) this.pick(a); else this.close(true); }
      else if (k === 'Escape'){ e.preventDefault(); e.stopPropagation(); this.close(true); }
      else if (k === 'Tab'){ this.close(false); }
    };

    return {
      rootRef: this.rootRef, btnRef: this.btnRef, listRef: this.listRef,
      label, hasLabel: !!label, labelId: uid + '-l', btnId: uid + '-b', listId: uid + '-lb',
      btnAria: (P.ariaLabel || label || 'Výběr') + ': ' + cur.label,
      expanded: open ? 'true' : 'false', open,
      disabledAttr: dis ? true : null,
      currentLabel: cur.label,
      onToggle: ()=>{ open ? this.close(true) : this.open(); },
      // focus zůstává na spouštěči (combobox), klávesy se řídí odtud
      onBtnKey: (e)=>{ if (open) { keyMove(e); return; } if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); this.open(); } },
      keepFocus: (e)=>{ e.preventDefault(); },
      activeDesc: (open && this.state.active >= 0) ? uid + '-o' + this.state.active : undefined,
      listTop: 'calc(100% + 4px)',
      btnStyle: 'width:100%;min-height:'+size+'px;display:flex;align-items:stretch;padding:0;border-radius:6px;overflow:hidden;background:'+bg+';box-shadow:'+ring+';transition:box-shadow 120ms ease;',
      valStyle: 'flex:1;min-width:0;display:flex;align-items:center;padding:0 8px 0 16px;font-size:'+fs+'px;font-weight:700;line-height:1.3;color:'+txt+';overflow:hidden;text-overflow:ellipsis;white-space:nowrap;',
      chevSize: size === 36 ? 18 : 24,
      chevRot: 'display:flex;transition:transform 150ms ease;' + (open ? 'transform:rotate(180deg);' : ''),
      chevStyle: variant === 'outline'
        ? 'flex:none;width:52px;background:'+(dis?'#D5DAE0':'#1E5AA8')+';color:#FFFFFF;display:flex;align-items:center;justify-content:center;'
        : 'flex:none;width:'+size+'px;color:'+(dis?'#9AA1AB':'#5189CC')+';display:flex;align-items:center;justify-content:center;',
      opts: opts.map((o,i)=>{
        const sel = o.value === value;
        return {
          id: uid + '-o' + i, label:o.label, note:o.note, hasNote: !!o.note,
          selected: sel ? 'true' : 'false', disabled: o.disabled ? 'true' : undefined,
          cls: 'se-opt' + (i === this.state.active ? ' se-act' : ''),
          style: 'display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 12px;border-radius:6px;cursor:pointer;',
          labelStyle: 'flex:1;min-width:0;font-size:'+fs+'px;line-height:1.35;font-weight:'+(sel?700:500)+';color:'+(o.disabled?'#9AA1AB':(sel?'#1E5AA8':'#15181C'))+';',
          checkStyle: 'flex:none;display:flex;color:#1E5AA8;' + (sel ? '' : 'visibility:hidden;'),
          onPick: ()=>this.pick(i),
          onHover: ()=>{ if (!o.disabled && this.state.active !== i) this.setState({ active:i }); }
        };
      })
    };
  }
}
</script>
</body>
</html>

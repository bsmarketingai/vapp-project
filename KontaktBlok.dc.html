<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#FFFFFF;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  .kb-i{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;text-decoration:none;cursor:pointer;}
  .kb-i:focus-visible{outline:2px solid #1E5AA8;outline-offset:2px;}
  .kb-tel{position:relative;transition:color .12s;}
  .kb-tel::after{content:"";position:absolute;left:0;right:0;top:-2px;bottom:-2px;}
  .kb-tel:hover{color:#1E5AA8;}
</style>
</helmet>
<div style="display:flex;align-items:center;gap:6px;flex:none;">
  <span aria-hidden="true" style="display:flex;color:#1E5AA8;flex:none;">
    <dc-import name="Ikony" icon-name="phone" size="24" hint-size="24px,24px"></dc-import>
  </span>
  <div style="display:flex;flex-direction:column;gap:0;min-width:0;">
    <a class="kb-i kb-tel" href="{{ phoneHref }}" style="font-size:16px;font-weight:700;line-height:1.25;color:#15181C;white-space:nowrap;">{{ phone }}</a>
    <span style="display:inline-flex;align-items:center;gap:8px;">
      <span style="display:flex;align-items:center;flex:none;font-size:0;line-height:0;">
        <dc-import name="LedIndikator" state="{{ ledState }}" label="" size="8" hint-size="8px,8px"></dc-import>
      </span>
      <span style="font-size:13px;font-weight:500;line-height:1.4;color:#666E78;white-space:nowrap;">{{ hours }}</span>
    </span>
  </div>
</div>
<dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:80},&quot;phone&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;323 605 314&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;phoneHref&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;tel:+420323605314&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hours&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;8:00–16:00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;debug&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const P = this.props;
    const open = P.open ?? true;
    return {
      phone: P.phone ?? '323 605 314',
      phoneHref: P.phoneHref ?? 'tel:+420323605314',
      hours: P.hours ?? '8:00–16:00',
      ledState: open ? 'open' : 'closed',
      debug: P.debug ?? true
    };
  }
}
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0!important;padding:0!important;background:#F7F9FB;}
  #dc-root{margin:0!important;padding:0!important;width:100%!important;max-width:none!important;border:0!important;}
  #dc-root>.sc-host{margin:0!important;padding:0!important;width:100%!important;}
  .ks-card{transition:box-shadow .15s;}
  .ks-card:hover{box-shadow:0 6px 20px rgba(20,47,86,.10) !important;}
  .a11y-i{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;text-align:inherit;line-height:inherit;text-decoration:none;cursor:pointer;}
  .a11y-i:focus-visible{outline:2px solid #1E5AA8;outline-offset:2px;}
  .ks-title::after{content:"";position:absolute;inset:0;z-index:0;}
  .ks-title:focus-visible{outline:none;}
  .ks-title:focus-visible::after{outline:2px solid #1E5AA8;outline-offset:-2px;border-radius:8px;}
  .ks-over{position:relative;z-index:1;}
  /* Cena je jinak zarovnaná doprava (stojí v kartě dílu vpravo od skladovosti);
     u služby stojí sama v řádku, takže se zarovnává doleva jako název a obj. č. */
  .ks-price > .sc-host > div{align-items:flex-start !important;}
</style>
</helmet>
<div class="ks-card" style="position:relative;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;background:#fff;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;height:100%;width:100%;min-width:0;">
  <div style="position:relative;">
    <sc-if value="{{ hasImg }}" hint-placeholder-val=""><div role="img" aria-label="{{ name }}" style="{{ imgStyle }}"></div></sc-if>
    <sc-if value="{{ noImg }}" hint-placeholder-val="{{ true }}">
      <div aria-hidden="true" style="aspect-ratio:16/10;background:#F2F4F7;display:flex;align-items:center;justify-content:center;color:#9AA1AB;">
        <dc-import name="Ikony" icon-name="tool" size="24" hint-size="24px,24px"></dc-import>
      </div>
    </sc-if>
  </div>
  <div style="padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1;">
    <a class="ks-title a11y-i" href="{{ href }}" style="display:block;font-size:16px;font-weight:700;color:#15181C;line-height:1.3;min-height:42px;">{{ name }}</a>
    <span style="font-size:13px;font-weight:400;line-height:1.4;color:#666E78;">Obj. č. {{ objNum }}</span>
    <div class="ks-price" style="margin-top:auto;display:flex;align-items:flex-end;justify-content:flex-start;gap:8px;">
      <dc-import name="Cena" size="large" price-net="{{ netNum }}" price-gross="{{ grossNum }}" currency="{{ currency }}" hint-size="130px,52px"></dc-import>
    </div>
    <div class="ks-over" style="display:flex;">
      <dc-import name="Tlacitko" variant="primary" size="medium" icon="calendar" label="{{ ctaLabel }}" full-width="true" on-click="{{ onOrder }}" style="width:100%;" hint-size="100%,44px"></dc-import>
    </div>
  </div>
</div>
<dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:300,&quot;height&quot;:420},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;,&quot;default&quot;:null},&quot;currency&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;CZK&quot;,&quot;EUR&quot;],&quot;default&quot;:&quot;CZK&quot;,&quot;tsType&quot;:&quot;'CZK'|'EUR'&quot;},&quot;ctaLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Objednat termín&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onOrder&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;,&quot;default&quot;:null},&quot;debug&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const P = this.props;
    const s = P.p || {};
    const kc = (v)=> typeof v==='number' ? v : (parseInt(String(v||'').replace(/[^0-9]/g,''),10)||0);
    const name = s.name ?? P.name ?? 'Celková prohlídka před STK — přívěs do 750 kg nebrzděný (1,1 h)';
    const img = s.img ?? P.img ?? '';
    return {
      name,
      objNum: s.objNum ?? P.objNum ?? 's30038',
      href: s.href ?? P.href ?? '#',
      netNum: kc(s.priceNet ?? P.priceNet ?? 990),
      grossNum: kc(s.price ?? P.priceGross ?? 1198),
      currency: P.currency || 'CZK',
      hasImg: !!img, noImg: !img,
      imgStyle: 'aspect-ratio:16/10;background:#fff url("' + img + '") center/contain no-repeat;background-origin:content-box;padding:16px 12px;',
      ctaLabel: P.ctaLabel || 'Objednat termín',
      onOrder: s.onOrder || P.onOrder || (()=>{}),
      debug: P.debug ?? true
    };
  }
}
</script>
</body>
</html>

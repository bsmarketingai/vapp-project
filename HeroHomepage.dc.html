<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#F7F9FB;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;color:#15181C;}
  .hh-in{max-width:1560px;margin:0 auto;padding:0 32px;}
  @media (max-width:819px){ .hh-in{padding:0 16px;} }
  .hh-pad{padding-top:72px;padding-bottom:72px;}
  @media (max-width:819px){ .hh-pad{padding-top:32px;padding-bottom:32px;} }
  .hh-panel{max-width:560px;}
  @media (max-width:549px){ .hh-panel{max-width:none;} }
  .hh-h1{font-size:36px;line-height:1.15;letter-spacing:-0.02em;}
  @media (max-width:819px){ .hh-h1{font-size:26px;line-height:1.2;} }
  .hh-lead{font-size:18px;line-height:1.6;}
  @media (max-width:819px){ .hh-lead{font-size:16px;} }
</style>
</helmet>
<section aria-labelledby="hh-title" style="position:relative;width:100%;overflow:hidden;background:#F2F4F7;">
  <img src="{{ image }}" alt="" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 62%;">
  <div aria-hidden="true" style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,47,86,.55) 0%,rgba(20,47,86,.18) 62%,rgba(20,47,86,0) 100%);"></div>
  <div class="hh-in hh-pad" style="position:relative;">
    <div class="hh-panel" style="background:rgba(255,255,255,.96);border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 30px rgba(20,30,45,.14);">
      <span style="font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#1E5AA8;">{{ overline }}</span>
      <h1 id="hh-title" class="hh-h1" style="margin:0;font-weight:700;color:#15181C;text-wrap:pretty;">{{ title }}</h1>
      <p class="hh-lead" style="margin:0;font-weight:400;color:#5A626C;text-wrap:pretty;">{{ lead }}</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;">
        <dc-import name="Tlacitko" variant="primary" size="large" label="{{ primaryLabel }}" icon-trailing="arrow-right" on-click="{{ onPrimary }}" hint-size="220px,52px"></dc-import>
        <dc-import name="Tlacitko" variant="secondary" size="large" label="{{ secondaryLabel }}" on-click="{{ onSecondary }}" hint-size="200px,52px"></dc-import>
      </div>
    </div>
  </div>
</section>
<dc-import name="DebugBar" visible="{{ debug }}" hint-size="0px,0px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:420},&quot;overline&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Český výrobce přívěsů od roku 1991&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Přívěsy, díly a servis na jednom místě&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Vyrábíme, prodáváme, půjčujeme i opravujeme. Náhradní díly máme skladem a autorizovaný servis AL-KO a KNOTT přímo u nás.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;primaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Prohlédnout přívěsy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;secondaryLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Poptat přívěs na míru&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPrimary&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onSecondary&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;debug&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Debug&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;./hero-privesy.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const P = this.props;
    return {
      image: P.image ?? './hero-prives-panorama.png',
      overline: P.overline ?? 'Český výrobce přívěsů od roku 1991',
      title: P.title ?? 'Přívěsy, díly a servis na jednom místě',
      lead: P.lead ?? 'Vyrábíme, prodáváme, půjčujeme i opravujeme. Náhradní díly máme skladem a autorizovaný servis AL-KO a KNOTT přímo u nás.',
      primaryLabel: P.primaryLabel ?? 'Prohlédnout přívěsy',
      primaryHref: P.primaryHref ?? '#privesy',
      secondaryLabel: P.secondaryLabel ?? 'Poptat přívěs na míru',
      onPrimary: P.onPrimary || (()=>{}),
      onSecondary: P.onSecondary || (()=>{}),
      debug: P.debug ?? true
    };
  }
}
</script>
</body>
</html>

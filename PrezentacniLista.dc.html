<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400..700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;font-family:'Exo 2','Helvetica Neue',Arial,sans-serif;}
  .pl-i{appearance:none;-webkit-appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;line-height:inherit;cursor:pointer;}
  .pl-i:focus-visible{outline:2px solid #FFFFFF;outline-offset:2px;}
  .pl-btn{transition:background .12s,color .12s;}
  .pl-btn:hover{background:#1E5AA8 !important;color:#FFFFFF !important;}
  @media (max-width:419px){ .pl-label{display:none !important;} .pl-btn{padding:0 10px !important;} }
  /* pill drž\u00ed jen na desktopu; na mobilu se blok zalamuje do v\u00edc \u0159\u00e1dk\u016f a 999 vypad\u00e1 rozbit\u011b */
  .pl-shell{border-radius:999px;}
  @media (max-width:819px){ .pl-shell{border-radius:8px;} }
</style>
</helmet>
<div style="position:fixed;left:16px;right:16px;bottom:16px;z-index:96;display:flex;justify-content:center;pointer-events:none;">
<sc-if value="{{ closed }}" hint-placeholder-val="">
<button type="button" class="pl-i pl-btn pl-shell" onClick="{{ onToggleOpen }}" aria-expanded="false" style="pointer-events:auto;min-height:36px;padding:0 14px;background:#142F56;color:#FFFFFF;font-size:13px;font-weight:700;box-shadow:0 10px 30px rgba(20,30,45,.14);">Varianty</button>
</sc-if>
<sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
<div class="pl-shell" style="pointer-events:auto;display:flex;align-items:center;flex-wrap:wrap;justify-content:center;gap:8px;padding:6px;background:#142F56;box-shadow:0 10px 30px rgba(20,30,45,.14);">
  <span class="pl-label" style="font-size:13px;font-weight:700;color:#B4CEEC;padding:0 4px 0 10px;">{{ label }}</span>
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="2">
    <button type="button" class="pl-i pl-btn" onClick="{{ it.onClick }}" aria-pressed="{{ it.pressed }}" style="{{ it.style }}">{{ it.label }}</button>
  </sc-for>
  <sc-if value="{{ hasGroup2 }}" hint-placeholder-val="">
    <span style="width:1px;height:20px;background:#1E5AA8;margin:0 2px;"></span>
    <span class="pl-label" style="font-size:13px;font-weight:700;color:#B4CEEC;padding:0 4px 0 4px;">{{ label2 }}</span>
    <sc-for list="{{ items2 }}" as="it" hint-placeholder-count="2">
      <button type="button" class="pl-i pl-btn" onClick="{{ it.onClick }}" aria-pressed="{{ it.pressed }}" style="{{ it.style }}">{{ it.label }}</button>
    </sc-for>
  </sc-if>
  <sc-if value="{{ hasGroup3 }}" hint-placeholder-val="">
    <span style="width:1px;height:20px;background:#1E5AA8;margin:0 2px;"></span>
    <span class="pl-label" style="font-size:13px;font-weight:700;color:#B4CEEC;padding:0 4px 0 4px;">{{ label3 }}</span>
    <sc-for list="{{ items3 }}" as="it" hint-placeholder-count="2">
      <button type="button" class="pl-i pl-btn" onClick="{{ it.onClick }}" aria-pressed="{{ it.pressed }}" style="{{ it.style }}">{{ it.label }}</button>
    </sc-for>
  </sc-if>
  <sc-if value="{{ hasGroup4 }}" hint-placeholder-val="">
    <span style="width:1px;height:20px;background:#1E5AA8;margin:0 2px;"></span>
    <span class="pl-label" style="font-size:13px;font-weight:700;color:#B4CEEC;padding:0 4px 0 4px;">{{ label4 }}</span>
    <sc-for list="{{ items4 }}" as="it" hint-placeholder-count="2">
      <button type="button" class="pl-i pl-btn" onClick="{{ it.onClick }}" aria-pressed="{{ it.pressed }}" style="{{ it.style }}">{{ it.label }}</button>
    </sc-for>
  </sc-if>
  <span style="width:1px;height:20px;background:#1E5AA8;margin:0 2px;"></span>
  <button type="button" class="pl-i pl-btn" onClick="{{ onToggleDebug }}" aria-pressed="{{ debugPressed }}" style="{{ debugStyle }}">Debug</button>
  <span style="width:1px;height:20px;background:#1E5AA8;margin:0 2px;"></span>
  <button type="button" class="pl-i pl-btn" onClick="{{ onToggleOpen }}" aria-label="Skrýt lištu variant" aria-expanded="true" style="width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:999px;color:#B4CEEC;font-size:16px;font-weight:700;line-height:1;">✕</button>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:120},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kategorie:&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variants&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,label:string}[]&quot;,&quot;default&quot;:null},&quot;active&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;v1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;,&quot;default&quot;:null},&quot;label2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variants2&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,label:string}[]&quot;,&quot;default&quot;:null},&quot;active2&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect2&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;,&quot;default&quot;:null},&quot;label3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variants3&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,label:string}[]&quot;,&quot;default&quot;:null},&quot;active3&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect3&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;,&quot;default&quot;:null},&quot;label4&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;variants4&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string,label:string}[]&quot;,&quot;default&quot;:null},&quot;active4&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onSelect4&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;,&quot;default&quot;:null},&quot;debugOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToggleDebug&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;,&quot;default&quot;:null}}">
class Component extends DCLogic {
  state = { open: true };
  BASE = 'min-height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;';
  ON = 'background:#FFFFFF;color:#142F56;';
  OFF = 'background:transparent;color:#B4CEEC;';
  DEFAULT_VARIANTS = [{ id:'v1', label:'Varianta 1' }, { id:'v2', label:'Varianta 2' }];
  renderVals(){
    const P = this.props;
    const onSelect = P.onSelect || (()=>{});
    const src = (Array.isArray(P.variants) && P.variants.length) ? P.variants : this.DEFAULT_VARIANTS;
    const active = P.active || 'v1';
    // per-položkové handlery se vyrábí tady — funkce vnořená v poli se přes dc-import ztrácí
    const items = src.map(v=>({
      label: v.label, pressed: v.id === active ? 'true' : 'false',
      style: this.BASE + (v.id === active ? this.ON : this.OFF),
      onClick: ()=>onSelect(String(v.id))
    }));
    const src2 = (Array.isArray(P.variants2) && P.variants2.length) ? P.variants2 : null;
    const onSelect2 = P.onSelect2 || (()=>{});
    const active2 = P.active2 || '';
    const items2 = src2 ? src2.map(v=>({
      label: v.label, pressed: v.id === active2 ? 'true' : 'false',
      style: this.BASE + (v.id === active2 ? this.ON : this.OFF),
      onClick: ()=>onSelect2(String(v.id))
    })) : [];
    const src3 = (Array.isArray(P.variants3) && P.variants3.length) ? P.variants3 : null;
    const onSelect3 = P.onSelect3 || (()=>{});
    const active3 = P.active3 || '';
    const items3 = src3 ? src3.map(v=>({
      label: v.label, pressed: v.id === active3 ? 'true' : 'false',
      style: this.BASE + (v.id === active3 ? this.ON : this.OFF),
      onClick: ()=>onSelect3(String(v.id))
    })) : [];
    const src4 = (Array.isArray(P.variants4) && P.variants4.length) ? P.variants4 : null;
    const onSelect4 = P.onSelect4 || (()=>{});
    const active4 = P.active4 || '';
    const items4 = src4 ? src4.map(v=>({
      label: v.label, pressed: v.id === active4 ? 'true' : 'false',
      style: this.BASE + (v.id === active4 ? this.ON : this.OFF),
      onClick: ()=>onSelect4(String(v.id))
    })) : [];
    const dOn = (P.debugOn ?? true) !== false;
    return {
      label: P.label || 'Kategorie:', items,
      hasGroup2: !!src2, label2: P.label2 || '', items2,
      hasGroup3: !!src3, label3: P.label3 || '', items3,
      hasGroup4: !!src4, label4: P.label4 || '', items4,
      open: this.state.open !== false, closed: this.state.open === false,
      onToggleOpen: ()=>this.setState(s=>({ open: s.open === false })),
      debugPressed: dOn ? 'true' : 'false',
      debugStyle: this.BASE + (dOn ? this.ON : this.OFF),
      onToggleDebug: P.onToggleDebug || (()=>{})
    };
  }
}
</script>
</body>
</html>
